<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">Limitful</title>
  <!-- A star whose every ray runs into a limit. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0b6b58"/>
  <g stroke-linecap="round" fill="none">
    <g transform="rotate(0 64 64)">
      <line x1="64" y1="64" x2="64" y2="24" stroke="#eef2ef" stroke-width="6.5"/>
      <line x1="53.5" y1="24" x2="74.5" y2="24" stroke="#f4c63a" stroke-width="8.5"/>
    </g>
    <g transform="rotate(45 64 64)">
      <line x1="64" y1="64" x2="64" y2="37" stroke="#eef2ef" stroke-width="6.5"/>
      <line x1="57.0" y1="37" x2="71.0" y2="37" stroke="#f4c63a" stroke-width="8.5"/>
    </g>
    <g transform="rotate(90 64 64)">
      <line x1="64" y1="64" x2="64" y2="24" stroke="#eef2ef" stroke-width="6.5"/>
      <line x1="53.5" y1="24" x2="74.5" y2="24" stroke="#f4c63a" stroke-width="8.5"/>
    </g>
    <g transform="rotate(135 64 64)">
      <line x1="64" y1="64" x2="64" y2="37" stroke="#eef2ef" stroke-width="6.5"/>
      <line x1="57.0" y1="37" x2="71.0" y2="37" stroke="#f4c63a" stroke-width="8.5"/>
    </g>
    <g transform="rotate(180 64 64)">
      <line x1="64" y1="64" x2="64" y2="24" stroke="#eef2ef" stroke-width="6.5"/>
      <line x1="53.5" y1="24" x2="74.5" y2="24" stroke="#f4c63a" stroke-width="8.5"/>
    </g>
    <g transform="rotate(225 64 64)">
      <line x1="64" y1="64" x2="64" y2="37" stroke="#eef2ef" stroke-width="6.5"/>
      <line x1="57.0" y1="37" x2="71.0" y2="37" stroke="#f4c63a" stroke-width="8.5"/>
    </g>
    <g transform="rotate(270 64 64)">
      <line x1="64" y1="64" x2="64" y2="24" stroke="#eef2ef" stroke-width="6.5"/>
      <line x1="53.5" y1="24" x2="74.5" y2="24" stroke="#f4c63a" stroke-width="8.5"/>
    </g>
    <g transform="rotate(315 64 64)">
      <line x1="64" y1="64" x2="64" y2="37" stroke="#eef2ef" stroke-width="6.5"/>
      <line x1="57.0" y1="37" x2="71.0" y2="37" stroke="#f4c63a" stroke-width="8.5"/>
    </g>
  </g>
</svg>
