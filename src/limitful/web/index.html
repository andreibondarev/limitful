<style>
  :root {

    --accent: #63d2b6;
    --who-0: #5fc3b3; --who-1: #7fa9e6; --who-2: #b29be6; --who-3: #e08fc4;

  /* The day as a strip: one mark for every stretch of speech. */

  /* Content runs the width of the header above it; lines of text keep their own measure. */

  /* In a conversation, a speaker's turn is one paragraph; each thing said in it can be played. */

    padding: 0.1rem 0.4rem; width: 12rem; font-weight: 600;
  }

    border: 1px solid var(--rule); border-radius: 999px; color: var(--ink);
  }
  .who small { color: var(--muted); margin-left: 0.6rem; font-size: 0.8rem; }
  .tools {

  }

  .glance { position: sticky; top: calc(var(--head, 10rem) + 1.5rem); max-height: calc(100vh - var(--head, 10rem) - 4.5rem); overflow-y: auto; padding-bottom: 0.5rem; }

  .glance .recap { margin: 0 0 1.6rem; padding: 1rem 1.1rem; max-width: none; }
  .glance .recap .headline { font-size: 1.2rem; }
  .glance .recap ul { font-size: 0.92rem; }
  .glance ul.plain { list-style: none; margin: 0; padding: 0; }
  .glance ul.plain li { border-top: 1px solid var(--rule); }
  .glance ul.plain button {
    display: block; width: 100%; padding: 0.5rem 0; border: 0; background: none; text-align: left; cursor: pointer; line-height: 1.4;
  }
  .glance ul.plain button:hover span { color: var(--accent); }
  .glance ul.plain small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.1rem; }
  .dot { display: inline-block; width: 0.55rem; height: 0.55rem; margin-right: 0.45rem; border-radius: 50%; background: var(--who, var(--muted)); }
  @media (max-width: 1100px) {
    .daygrid { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .glance { position: static; max-height: none; order: -1; margin-bottom: 0.6rem; }
  }
  .scraps { border-top: 1px solid var(--rule); }
  .scraps > summary {
    display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); align-items: baseline;
    padding: 0.5rem 0; cursor: pointer; list-style: none; color: var(--muted); font-size: 0.85rem;
  }
  .scraps > summary::-webkit-details-marker { display: none; }
  .scraps > summary b { font-weight: 500; }
  .scraps > summary small { display: block; font-family: var(--voice); font-style: italic; font-size: 0.9rem; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scraps > summary:hover b { color: var(--accent); }
  .scraps[open] > summary small { display: none; }
  .scraps .card > summary { padding: 0.5rem 0; }
  .when { padding-right: 1.1rem; }
  .len { display: block; height: 3px; margin-top: 0.4rem; border-radius: 2px; background: color-mix(in srgb, var(--accent) 60%, transparent); }
  .len[hidden] { display: none; }
  .card { border-top: 1px solid var(--rule); }
  .card > summary {
    display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); align-items: baseline;
    padding: 0.85rem 0; cursor: pointer; list-style: none;
  }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary time { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  .card > summary h2 { margin: 0; font-size: 1.35rem; line-height: 1.25; max-width: 68ch; }
  .card > summary h2.untitled { color: var(--muted); font-style: italic; font-size: 1.12rem; }
  .card > summary:hover h2 { color: var(--accent); }
  .card[open] > summary h2 { color: var(--accent); }
  .card .meta { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .card .body { padding: 0 0 1.4rem; }
  /* An open conversation keeps its title in view while you read down it. */
  .card[open] > summary { position: sticky; top: var(--head, 10rem); z-index: 1; background: var(--paper); box-shadow: 0 1px 0 var(--rule); }
  .card .brief {
    margin: 0.2rem 0 0.7rem var(--gutter); padding: 0.8rem 1rem; max-width: 68ch;
    border-radius: 12px; background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  .card .brief > ul { margin: 0; padding-left: 1.1rem; line-height: 1.5; }

  .card .brief > .todo:first-child { margin-top: 0; }
  .card .body > ul {
    margin: 0 0 0.6rem var(--gutter); padding-left: 1.1rem; max-width: 68ch;
    color: var(--muted); font-size: 0.95rem; line-height: 1.5;
  }
  .card .body > .todo, .card .copy { margin-left: var(--gutter); }
  .card .copy { margin-top: 0.4rem; }
  .card h3 {
    margin: 1.6rem 0 0.2rem var(--gutter); max-width: 68ch;
    font-family: var(--voice); font-size: 1.18rem; font-weight: 600; line-height: 1.3;
  }
  .card h4 {
    margin: 1rem 0 0.1rem var(--gutter); max-width: 68ch;
    font-size: 0.92rem; font-weight: 600; color: var(--muted);
  }
  .todo {
    display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    margin-top: 0.5rem; padding: 0.45rem 0.7rem;
    border-left: 3px solid var(--mark); background: color-mix(in srgb, var(--mark) 14%, transparent);
    border-radius: 0 4px 4px 0; max-width: 68ch;
  }
  .todo p { margin: 0; flex: 1 1 14rem; }

  .todo .where a { color: var(--accent); text-underline-offset: 3px; }
  .todo .where q { display: block; margin-top: 0.2rem; font-family: var(--voice); font-size: 0.95rem; font-style: italic; }
  .todo .jump { border-style: dashed; }
  .recap { margin: 0 0 1.8rem; padding: 1.3rem 1.5rem 1.2rem; max-width: 46rem; border-left: 3px solid var(--mark); background: color-mix(in srgb, var(--accent) 5%, transparent); border-radius: 0 14px 14px 0; }
  .recap.bare { padding: 0; border: 0; background: none; }
  .recap .headline { margin: 0; font-family: var(--voice); font-size: 1.45rem; line-height: 1.3; text-wrap: balance; }
  .recap ul { margin: 0.8rem 0 0; padding-left: 1.1rem; color: var(--muted); line-height: 1.55; }
  .recap li + li { margin-top: 0.3rem; }
  .recap .stale { margin: 0.9rem 0 0; font-size: 0.88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .recap .oops { margin: 0.6rem 0 0; color: #b3261e; font-size: 0.9rem; }
  .remind { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 3.5rem; align-items: start; }
  .remind h2 { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 0.3rem; font-size: 1.6rem; }
  .remind h2 small { font-family: var(--chrome); font-size: 0.85rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 0.05rem 0.55rem; }
  .remind h2 .icon { color: var(--accent); }
  .remind .about { margin: 0 0 0.4rem; color: var(--muted); line-height: 1.5; max-width: 34rem; }
  .remind h3 { margin: 1.6rem 0 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .remind .none { color: var(--muted); margin: 1rem 0; line-height: 1.5; }
  .idea, .task { display: grid; gap: 0.9rem; align-items: start; padding: 0.85rem 0; border-top: 1px solid var(--rule); }
  .idea { grid-template-columns: minmax(0, 1fr) auto; }
  .task { grid-template-columns: auto minmax(0, 1fr) auto; }
  .idea p, .task p { margin: 0; font-family: var(--voice); font-size: 1.15rem; line-height: 1.4; }
  .from { margin-top: 0.3rem; color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
  .from .icon { margin-right: 0.35rem; vertical-align: -0.15em; }
  .from a { color: var(--accent); text-underline-offset: 3px; }
  .from q { display: block; margin-top: 0.15rem; font-family: var(--voice); font-style: italic; font-size: 0.95rem; }
  .acts { display: flex; gap: 0.4rem; }
  .round {
    width: 2.2rem; height: 2.2rem; flex: none; display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 50%; background: transparent; color: var(--muted);
  }
  .round .icon { margin: 0; }

    background: var(--ink); color: var(--paper);
  }
  #transport { display: flex; align-items: center; gap: 0.7rem; }
  #seek { flex: 1; min-width: 5rem; height: 1.4rem; margin: 0; accent-color: var(--mark); cursor: pointer; }
  #at, #total { font-size: 0.82rem; font-variant-numeric: tabular-nums; opacity: 0.8; min-width: 2.6rem; }
  #at { text-align: right; }
  .skip {
    border: 1px solid color-mix(in srgb, var(--paper) 35%, transparent); border-radius: 999px;
    background: transparent; color: inherit; padding: 0.3rem 0.65rem; cursor: pointer;
    font-size: 0.82rem; white-space: nowrap;
  }
  .skip:hover { border-color: var(--mark); color: var(--mark); }
  #player :focus-visible { outline-color: var(--mark); }
  #player[hidden] { display: none; }
  #toggle {
    border: 0; border-radius: 999px; padding: 0.4rem 1rem; cursor: pointer;
    background: var(--mark); color: var(--mark-ink); font-weight: 600;
    min-width: 5.2rem;
  }
  #now { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--voice); font-size: 1.05rem; }
  #now time { font-family: var(--chrome); font-size: 0.82rem; opacity: 0.75; margin-right: 0.6rem; font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    :root { --gutter: 4.4rem; }
    .line span, .turn p { font-size: 1.08rem; }
  }
  /* On a phone the header scrolls away with the page: it is too tall to pin. */
  @media (max-width: 620px) {
    header { position: static; }
    html { scroll-padding-top: 5rem; }
    .bar h1 { flex: 1 1 calc(100% - 4rem); }
    .card[open] > summary { top: 0; }
    .turn time, .line time, .card > summary time { font-size: 0.72rem; }
    .turn.tinted { background-position-x: calc(var(--gutter) - 0.45rem); }
    .line.tinted { background-position-x: calc(var(--gutter) - 0.45rem); }
    #calendar { position: fixed; top: 4.5rem; left: 1rem; right: 1rem; width: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a id="home" href="#" aria-label="Limitful: go to the latest day" title="Limitful (*limits apply)"><svg viewBox="0 0 128 128" width="36" height="36" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="28" fill="#0b6b58"/><g transform="translate(64.0 64.0)" fill="#f4c63a"><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(0)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(60)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(120)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(180)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(240)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(300)"/><circle r="4.41"/></g></svg></a>
    <h1 id="title">Lifelog</h1>
    <button class="step" id="prev" aria-label="Previous day with recordings">‹</button>
    <button class="step" id="next" aria-label="Next day with recordings">›</button>
    <div id="when">
      <button id="pick" aria-haspopup="dialog" aria-expanded="false" title="Open the calendar"></button>
      <div id="calendar" role="dialog" aria-label="Calendar" hidden></div>
    </div>
    <button id="paused" hidden title="Audio is not being kept. Click to open Settings."><span>Paused</span></button>
    <button id="ask" aria-pressed="false"><span>Ask</span></button>
    <button id="remind" aria-pressed="false"><span id="remindLabel">Reminders</span></button>
    <button id="settings" aria-pressed="false" aria-label="Settings" title="Settings"></button>
    <input type="file" id="file" accept=".zip,application/zip" hidden>
    <input type="search" id="search" placeholder="Search what was said" aria-label="Search what was said">
  </div>
  <p id="status" role="status" hidden></p>
  <p id="demobar" hidden></p>
  <div id="strip" role="img" aria-label="When speech was recorded during this day"></div>
  <div id="hours" aria-hidden="true"></div>
</header>
<main id="main" aria-live="polite"></main>
<div id="player" hidden>
  <div id="now"></div>
  <div id="transport">
    <button id="toggle">Pause</button>
    <button class="skip" id="back" aria-label="Back 10 seconds">−10 s</button>
    <button class="skip" id="ahead" aria-label="Forward 10 seconds">+10 s</button>
    <span id="at">0:00</span>
    <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Position in this conversation">
    <span id="total">0:00</span>
  </div>
</div>
<audio id="audio" preload="auto"></audio>

<script>
const $ = (id) => document.getElementById(id);
const main = $("main"), strip = $("strip"), audio = $("audio");
const DAY_MS = 86400000, QUIET_MS = 120000;
const clock = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit" });
const clockSec = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
const longDay = new Intl.DateTimeFormat([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const thisYearDay = new Intl.DateTimeFormat([], { weekday: "long", day: "numeric", month: "long" });

let days = [];        // [{day, lines}] for days that have speech
let day = null;       // "YYYY-MM-DD" being shown
let lines = [];       // utterances of that day
let playing = null;   // utterance being played
let wanted = null;    // { line, talk }: what to reveal after loading a day
let searching = false;
let talks = [];       // summarised conversations of the day
let reminding = false;
let configuring = false;
let asking = false;
let chat = [];        // the Ask thread: [{ role, content, lines }]
let chatId = null;    // its saved id, once the first question has been answered
let threads = [];     // saved threads: [{ id, title, updated, questions }]
let chatBusy = false;
let groups = [];              // the day's conversation cards
const openCards = new Set();  // cards the reader has opened, kept across refreshes
const TALK_GAP_MS = 300000;   // a silence this long separates unsummarised conversations

const pad = (n) => String(n).padStart(2, "0");
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayStart = (key) => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

/* Icons: 24-unit line drawings that take the colour of the text around them. */
const ICONS = {
  ask: "M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z",
  reminders: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M8 12.5l2.8 2.8L16 9.5",
  settings: "M4 7h9 M17 7h3 M4 17h3 M11 17h9 M15 4.5v5 M9 14.5v5",
  refresh: "M20 12a8 8 0 1 1-2.6-5.9 M20 4v5h-5",
  sync: "M12 3v12 M7 10.5l5 5 5-5 M4 20h16",
  wave: "M3 12v0 M7 8.5v7 M11 5v14 M15 9v6 M19 11v2",
  room: "M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3Z M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3",
  dim: "M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z",
  bright: "M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z M12 3v2.5 M12 18.5V21 M3 12h2.5 M18.5 12H21 M5.6 5.6l1.8 1.8 M16.6 16.6l1.8 1.8 M5.6 18.4l1.8-1.8 M16.6 7.4l1.8-1.8",
  summary: "M5 6h14 M5 11h14 M5 16h9",
  import: "M12 3v11 M7.5 9.5 12 14l4.5-4.5 M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3",
  pendant: "M9 4.5h6v4H9Z M12 21a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13Z",
  key: "M14.5 9.5a4 4 0 1 0-3.6 4l1.6 1.5h2v2h2v2h3v-3l-5.2-5.2c.1-.4.2-.9.2-1.3Z",
  send: "M12 19V5 M6 11l6-6 6 6",
  plus: "M12 5v14 M5 12h14",
  chats: "M4 6h16 M4 12h16 M4 18h10",
  people: "M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M3.5 19a5.5 5.5 0 0 1 11 0 M16 11a2.5 2.5 0 1 0 0-5 M17.5 14.2A4.8 4.8 0 0 1 20.5 19",
  day: "M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z M4 10h16 M8 4v4 M16 4v4",
  check: "M5 12.5l4.5 4.5L19 7.5",
  plug: "M9 3v5 M15 3v5 M6.5 8h11v3.5a5.5 5.5 0 0 1-11 0z M12 17v4",
  x: "M6.5 6.5l11 11 M17.5 6.5l-11 11",
  find: "M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z M16.2 16.2 20.5 20.5",
  clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M12 7.5V12l3 2",
  stop: "M7 7h10v10H7Z",
  pause: "M9 5v14 M15 5v14",
  play: "M8 5v14l11-7Z",
  link: "M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1",
  unlink: "M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1 M4 4l16 16",
};
const SVG = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}) {
  const node = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  return node;
}
function icon(name, size = 18) {
  const svg = svgEl("svg", { viewBox: "0 0 24 24", width: size, height: size, fill: "none", stroke: "currentColor",
    "stroke-width": 1.7, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true", class: "icon" });
  if (ICONS[name]) svg.append(svgEl("path", { d: ICONS[name] }));
  return svg;
}
/* The Limitful asterisk, as the answering voice in Ask. */
function star(size) {
  const svg = svgEl("svg", { viewBox: "-42 -42 84 84", width: size, height: size, "aria-hidden": "true", class: "star" });
  for (let i = 0; i < 6; i++) {
    svg.append(svgEl("path", { d: "M-2.6 0L-6.4 -33.6A6.4 6.4 0 0 1 6.4 -33.6L2.6 0Z", fill: "var(--mark)", transform: `rotate(${i * 60})` }));
  }
  svg.append(svgEl("circle", { r: 4.2, fill: "var(--mark)" }));
  return svg;
}
/* A heading or button label with its icon in front. */
const withIcon = (name, text, size) => [icon(name, size), el("span", { textContent: text })];

async function get(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function quietFor(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return `quiet for ${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return `quiet for ${h} h${m ? ` ${m} min` : ""}`;
}

function lineButton(u, showDay, sameMinute) {
  const t = new Date(u.start);
  // Within a run of speech, only show the time when the minute changes.
  const b = el("button", { className: "line", id: `u${u.id}`, title: clockSec.format(t) },
    el("time", { dateTime: t.toISOString(), textContent: sameMinute ? "" : clock.format(t) }),
    el("span", { textContent: u.text }));
  if (!u.audio && !showDay) b.classList.add("mute");
  b.addEventListener("click", () => showDay ? openDay(showDay, u.id) : play(u));
  return b;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

/* First run: a guide from an empty folder to a Lifelog with something in it. */
let welcoming = false;
let welcomeTimer = null;  // while the guide follows a background job
function leaveWelcome() {
  welcoming = false;
  if (welcomeTimer) { clearInterval(welcomeTimer); welcomeTimer = null; }
}
const welcomed = () => { try { return localStorage.getItem("limitful-welcomed") === "1"; } catch { return false; } };
const setWelcomed = () => { try { localStorage.setItem("limitful-welcomed", "1"); } catch { /* private window */ } };

/* The pendant, front on: clip, microphone holes, side button and its light. */
function pendantDrawing(width = 108) {
  const glow = svgEl("circle", { cx: 60, cy: 86, r: 2.7, fill: "#ffffff" });
  const halo = svgEl("circle", { cx: 60, cy: 86, r: 10, fill: "#ffffff" });
  const holes = (d) => svgEl("path", { d, fill: "none", stroke: "#131517", "stroke-width": 1.7,
    "stroke-linecap": "round", "stroke-dasharray": "0.01 3.4" });
  const node = svgEl("svg", { viewBox: "0 0 120 136", width, height: Math.round(width * 136 / 120), role: "img", "aria-label": "The pendant" });
  node.append(
    svgEl("path", { d: "M34 60V28a22 22 0 0 1 22-22h8a22 22 0 0 1 22 22v32Z", fill: "#3c4044" }),       // clip
    svgEl("rect", { x: 104, y: 79, width: 5, height: 20, rx: 2.5, fill: "#1b1d1f" }),                    // side button
    svgEl("circle", { cx: 60, cy: 86, r: 47, fill: "#26292c" }),                                         // body
    svgEl("circle", { cx: 60, cy: 86, r: 43.5, fill: "#3a3e42" }),                                       // face
    holes("M28.7 71.4A34.5 34.5 0 0 1 91.3 71.4"),
    holes("M31.9 72.9A31 31 0 0 1 88.1 72.9"),
    holes("M35.1 74.4A27.5 27.5 0 0 1 84.9 74.4"),
    halo, glow);
  return { node, glow, halo };
}

async function showWelcome(step = "start") {
  leaveWelcome();
  welcoming = true;
  searching = reminding = configuring = asking = false;
  main.classList.remove("wide");
  document.querySelector("header").classList.add("plain");
  for (const id of ["ask", "remind", "settings"]) $(id).setAttribute("aria-pressed", "false");
  history.replaceState(null, "", "#welcome");
  $("title").textContent = "Welcome";
  strip.replaceChildren();
  say("");

  const ROUTE = ["before", "connect", "sync", "summaries"];  // the numbered steps of the pendant path
  const button = (label, onClick, kind = "") => {
    const b = el("button", { className: `pill ${kind}`, textContent: label });
    b.addEventListener("click", onClick);
    return b;
  };
  const page = (stage, title, ...children) => {
    const at = ROUTE.indexOf(stage);
    const head = at < 0 ? [] : [
      el("div", { className: "progress", role: "img", ariaLabel: `Step ${at + 1} of ${ROUTE.length}` },
        ...ROUTE.map((_, n) => el("i", { className: n <= at ? "done" : "" }))),
      el("p", { className: "where", textContent: `Step ${at + 1} of ${ROUTE.length}` })];
    main.replaceChildren(el("div", { className: "welcome" }, ...head, el("h2", { textContent: title }), ...children));
    main.querySelector("h2").scrollIntoView({ block: "nearest" });
  };
  const trouble = (message, advice) => el("div", { className: "trouble", role: "alert" },
    el("p", { textContent: message.endsWith(".") ? message : `${message}.` }),
    ...(advice ? [el("p", { className: "advice", textContent: advice })] : []));
  // Poll the server's job until it stops; `each` sees every reading.
  const follow = (each) => new Promise((resolve) => {
    const tick = async () => {
      let job;
      try { job = await get("/api/status"); } catch { return; }
      if (!welcoming) return;
      each(job);
      if (!job.running) { clearInterval(welcomeTimer); welcomeTimer = null; resolve(job); }
    };
    welcomeTimer = setInterval(tick, 1500);
    tick();
  });
  const finish = async (fullestDay = false) => {
    setWelcomed();
    try { days = await get("/api/days"); } catch { /* keep what we had */ }
    countReminders();
    const busiest = fullestDay && days.length ? days.reduce((a, b) => (b.lines > a.lines ? b : a)) : null;
    openDay(busiest ? busiest.day : days.length ? days[days.length - 1].day : dayKey(new Date()));
  };
  let state = { empty: true, demo: false, model_ready: true, provider: null };
  try { state = await get("/api/welcome"); } catch { /* assume a fresh start */ }
  if (!welcoming) return;

  const steps = {
    start() {
      const way = (pic, title, about, go) => {
        const b = el("button", { className: "way" }, icon(pic, 26), el("span", {}, el("b", { textContent: title }), el("small", { textContent: about })));
        b.addEventListener("click", go);
        return b;
      };
      const note = el("p", { className: "small" });
      page("", "Keep your pendant working",
        el("p", { className: "lede", textContent: "Limitful takes recordings off your Limitless Pendant, turns them into text on this computer, and keeps them here to read, search and ask about. No Limitless account is involved. Where would you like to start?" }),
        way("pendant", "Connect my pendant", "Pair it with this computer and bring in what it has recorded. Allow ten minutes the first time, mostly for a download.", () => steps.before()),
        way("import", "Import my Limitless history", "Bring in a data export from Limitless: transcripts, audio and reminders.", () => steps.history()),
        way("day", "Look around first", "Fill the Lifelog with made-up conversations. You can remove them with one click.", async () => {
          note.textContent = "Writing the made-up conversations…";
          try { await post("/api/demo", { action: "load" }); await showDemoBar(); await finish(true); }
          catch (err) { note.textContent = `Could not load them. ${err.message}`; }
        }),
        note,
        el("p", { className: "small" }, button("Skip, and open the Lifelog", () => finish(), "plain")));
    },

    before() {
      const item = (lead, rest) => el("li", {}, el("b", { textContent: lead }), " ", rest);
      page("before", "Before you connect",
        el("ol", { className: "prep" },
          item("Let the Limitless app sync one last time.", "Pairing with this computer resets the pendant, and that erases any audio it has not handed over yet. Skip this if you no longer use the app."),
          item("Ask Limitless for your data export.", "The service ends on December 1, 2026 and its copy of your history goes with it. You can import the export here whenever it arrives."),
          item("Turn off Bluetooth on your phone.", "The pendant talks to one device at a time, and the phone usually gets there first. Quitting the Limitless app also works.")),
        el("p", { className: "small", textContent: "Your computer may ask whether this program can use Bluetooth. Allow it." }),
        el("div", { className: "row" }, button("I've done these", () => steps.connect(), "main"), button("Back", () => steps.start())));
    },

    async connect() {
      const status = el("p", { className: "lede", textContent: "This takes a few seconds over Bluetooth." });
      const actions = el("div", { className: "row" });
      page("connect", "Looking for your pendant…", status, actions);
      const title = main.querySelector("h2");
      let p;
      try { p = await post("/api/pendant", { action: "check" }); }
      catch (err) { p = { error: err.message }; }
      if (!welcoming || !title.isConnected) return;
      if (!p.error) {
        title.textContent = "Found it";
        const waiting = p.minutes_waiting < 1 ? "nothing waiting to sync" : `about ${lengthOf(p.minutes_waiting * 60000)} of audio waiting`;
        status.textContent = `Your pendant is already paired with this computer. Battery ${p.battery}%, ${waiting}.`;
        actions.append(button("Continue", () => steps.sync(), "main"));
        return;
      }
      if (/not paired/.test(p.error)) {
        title.textContent = "Found it, not yet paired";
        status.textContent = "The pendant is nearby but has not been paired with this computer.";
        actions.append(button("Pair it", () => steps.pair(), "main"), button("Back", () => steps.before()));
        return;
      }
      title.textContent = "Could not find your pendant";
      status.replaceWith(trouble(p.error, p.advice));
      actions.append(button("Look again", () => steps.connect(), "main"), button("Pair it anyway", () => steps.pair()), button("Back", () => steps.before()));
    },

    pair() {
      const { node, glow, halo } = pendantDrawing(150);
      const light = (colour, pulsing) => {
        glow.setAttribute("fill", colour);
        halo.setAttribute("fill", colour);
        halo.setAttribute("opacity", colour === "#ffffff" ? 0.1 : 0.35);
        node.classList.toggle("pulsing", Boolean(pulsing));
      };
      light("#ffffff");
      const status = el("p", { className: "status", role: "status" });
      const start = button("Start pairing", async () => {
        start.disabled = true;
        status.replaceChildren("Waiting for the pendant. Do the button press now.");
        light("#b48cff", true);
        try { await post("/api/pendant", { action: "pair" }); }
        catch (err) { status.replaceChildren(trouble(err.message)); light("#ffffff"); start.disabled = false; return; }
        const began = Date.now();
        const job = await follow((j) => {
          const left = Math.max(0, 180 - Math.round((Date.now() - began) / 1000));
          if (j.running) status.textContent = `Waiting for the pendant. Do the button press now. ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")} left.`;
        });
        if (job.error) {
          light("#ffffff");
          status.replaceChildren(trouble(job.error, job.advice));
          start.textContent = "Try again";
          start.disabled = false;
          return;
        }
        light("#3d8bff");
        status.textContent = "Paired. The pendant accepted this computer.";
        start.replaceWith(button("Continue", () => steps.sync(), "main"));
      }, "main");
      page("connect", "Pair your pendant",
        el("div", { className: "pairing" }, node,
          el("ol", { className: "prep" },
            el("li", { textContent: "Click Start pairing. It waits three minutes." }),
            el("li", { textContent: "On the pendant, press the side button once and let go, then straight away press and hold it." }),
            el("li", { textContent: "A purple light comes on. Keep holding until it goes out, then let go." }),
            el("li", { textContent: "A blue light means it is ready. Accept the connection request your computer shows." }))),
        el("p", { className: "hold", textContent: "This resets the pendant. Any audio it has not synced yet is erased." }),
        status,
        el("div", { className: "row" }, start, button("Back", () => steps.before())));
    },

    sync() {
      const status = el("p", { className: "status", role: "status" });
      const bar = el("i");
      const meter = el("div", { className: "meter wide", hidden: true }, bar);
      const skip = button("Skip for now", () => steps.summaries());

  };

/* A switch for starting at login and syncing without a terminal. Fills itself in once loaded. */
function autostartSwitch() {
  const box = el("input", { type: "checkbox", disabled: true });
  const about = el("small", { textContent: "Checking…" });
  const node = el("label", { className: "switch" }, box,
    el("span", {}, el("b", { textContent: "Start at login and keep the pendant synced" }), about));
  const show = (a) => {
    box.checked = a.enabled;
    box.disabled = !a.supported;
    about.classList.remove("failed");
    if (!a.supported) { about.textContent = "Only on macOS so far. Elsewhere, leave limitful watch running in a terminal."; return; }
    const last = a.last ? ` Last tried ${clock.format(new Date(a.last))}: ${a.found ? "pendant found" : "pendant not in reach"}.` : "";
    about.textContent = a.enabled
      ? `Limitful starts when you log in and syncs the pendant every two minutes, with no terminal open. Synced audio is freed on the pendant.${a.syncing_every ? " It is syncing by itself now." : ""}${last}`
      : "Off. The pendant syncs only when you click Sync now or run limitful watch.";
  };
  get("/api/autostart").then(show).catch(() => { about.textContent = "Could not check."; });
  box.addEventListener("change", async () => {
    box.disabled = true;
    try { show(await post("/api/autostart", { enabled: box.checked })); }
    catch (err) { box.checked = !box.checked; box.disabled = false; about.textContent = err.message; about.classList.add("failed"); }
  });
  return node;
}

    const b = el("button", { textContent: label });

      catch (err) { row.append(el("small", { textContent: `Could not save. ${err.message}` })); }

/* Reminders: suggestions to sort through on the left, your own list on the right. */
async function showReminders() {
  leaveWelcome();
  main.classList.remove("wide");
  document.querySelector("header").classList.add("plain");
  reminding = true;
  configuring = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");

  strip.replaceChildren();

  catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load reminders. ${err.message}` }));
    return;
  }
  const set = async (r, status, row) => {
    try { await post(`/api/reminders/${r.id}`, { status }); await showReminders(); }
    catch (err) { row.append(el("small", { className: "oops", textContent: `Could not save. ${err.message}` })); }
  };
  const round = (name, label, onClick, extra = "") => {
    const b = el("button", { className: `round ${extra}`, ariaLabel: label, title: label }, icon(name, 18));

  const source = (r) => {

    go.addEventListener("click", (e) => { e.preventDefault(); openDay(r.day, r.line?.id, r.conversation, true); });
    const box = el("div", { className: "from" }, icon("ask", 14), go);
    if (r.line) box.append(el("q", { textContent: r.line.text.length > 150 ? `${r.line.text.slice(0, 150)}…` : r.line.text }));
    return box;
  };

  // --- suggestions, grouped by the day they came up
  const suggested = all.filter((r) => r.status === "suggested");
  const inbox = el("section", { className: "inbox" },
    el("h2", {}, star(22), el("span", { textContent: "Suggested" }), el("small", { textContent: String(suggested.length) })),
    el("p", { className: "about", textContent: "Things someone said they would do, found in your conversations. Keep the ones that matter; the link plays the moment it came up." }));
  let lastDay = null;
  for (const r of suggested) {
    const when = new Date(r.line ? r.line.start : r.start);
    const key = dayKey(when);
    if (key !== lastDay) { lastDay = key; inbox.append(el("h3", { textContent: longDay.format(when) })); }
    const row = el("article", { className: "idea" });
    row.append(
      el("div", {}, el("p", { textContent: r.text }), source(r)),
      el("div", { className: "acts" },
        round("check", "Keep this reminder", () => set(r, "accepted", row), "yes"),
        round("x", "Dismiss this suggestion", () => set(r, "dismissed", row))));
    inbox.append(row);
  }
  if (!suggested.length) inbox.append(el("p", { className: "none", textContent: "Nothing to sort through. New suggestions appear as conversations are summarised." }));

  // --- your list: what you kept, then what you have finished
  const kept = all.filter((r) => r.status === "accepted"), done = all.filter((r) => r.status === "done");
  const list = el("section", { className: "mine" },
    el("h2", {}, icon("reminders", 22), el("span", { textContent: "To do" }), el("small", { textContent: String(kept.length) })));
  for (const r of kept) {
    const row = el("article", { className: "task" });
    row.append(
      round("", "Mark as done", () => set(r, "done", row), "tick"),
      el("div", {}, el("p", { textContent: r.text }), source(r)),
      round("x", "Remove from your list", () => set(r, "dismissed", row), "faint"));
    list.append(row);
  }
  if (!kept.length) list.append(el("p", { className: "none", textContent: "Keep a suggestion and it lands here." }));
  if (done.length) {
    const finished = el("details", { className: "finished" }, el("summary", { textContent: `Done (${done.length})` }));
    for (const r of done) {
      const row = el("article", { className: "task was" });
      row.append(round("check", "Not done after all", () => set(r, "accepted", row), "tick ticked"), el("div", {}, el("p", { textContent: r.text })));
      finished.append(row);
    }
    list.append(finished);
  }
  main.replaceChildren(el("div", { className: "remind" }, inbox, list));
  countReminders();
}

/* Speakers are told apart by colour. A named person keeps theirs from day to day; a numbered
   speaker's only holds within its conversation, like the number itself. */
const WHO_COLOURS = 8;
const whoIndex = (speaker) => speaker.id !== null ? speaker.id % WHO_COLOURS
  : ((parseInt(speaker.name.replace(/\D/g, ""), 10) || 1) + 3) % WHO_COLOURS;
function tinter() {
  const given = new Map(), taken = new Set();
  return (speaker) => {
    if (!speaker) return null;
    const key = speaker.id ?? speaker.name;
    if (!given.has(key)) {
      let i = whoIndex(speaker);
      for (let n = 0; n < WHO_COLOURS && taken.has(i); n++) i = (i + 1) % WHO_COLOURS;  // two people never share one
      taken.add(i);
      given.set(key, i);
    }
    return `var(--who-${given.get(key)})`;
  };
}

function whoRow(speaker, colour) {
  if (!speaker) return el("div", { className: "who unknown", textContent: "Not identified" });
  const linked = speaker.id !== null;  // false: an imported label not yet tied to a person
  const row = el("div", { className: "who" });
  if (colour) row.style.setProperty("--who", colour);
  const name = el("button", {}, el("i", { className: "dot" }), speaker.name);
  name.title = "Name this speaker";
  name.addEventListener("click", () => {
    const input = el("input", { value: linked ? speaker.name : "", placeholder: "Who is this?", maxLength: 80, ariaLabel: "Speaker name" });
    const here = el("button", { className: "here", textContent: "Only this conversation" });
    const hint = el("small", { textContent: linked
      ? "Enter renames this person everywhere."
      : "Enter names this speaker in this conversation." });
    row.replaceChildren(input, ...(linked ? [here] : []), hint);
    input.focus(); input.select();
    let busy = false;
    const cancel = () => { if (!busy) row.replaceChildren(name); };
    const save = async (everywhere) => {
      const value = input.value.trim();
      if (!value || (everywhere && value === speaker.name)) { cancel(); return; }
      busy = true;
      try {
        await post(everywhere ? `/api/speakers/${speaker.id}` : `/api/lines/${speaker.line}/speaker`, { name: value });
        lines = await get(`/api/day/${day}`);
        renderDay();
      } catch (err) {
        busy = false;
        hint.textContent = `Could not save. ${err.message}`;
      }
    };
    // Leaving the field cancels, unless the click went to the button beside it.
    input.addEventListener("blur", (e) => { if (e.relatedTarget !== here) cancel(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Escape") cancel();
      else if (e.key === "Enter") save(linked);
    });
    here.addEventListener("click", () => save(false));
  });
  row.append(name);
  return row;
}

async function showRecap(box, forDay) {

    });

/* The calendar: a month at a time, each day shaded by how much was said, with the day's
   recap shown as you point at it. */
const shortDay = new Intl.DateTimeFormat([], { day: "numeric", month: "short", year: "numeric" });
const monthName = new Intl.DateTimeFormat([], { month: "long", year: "numeric" });
const weekdayName = new Intl.DateTimeFormat([], { weekday: "narrow" });
let calendarMonth = null;  // first day of the month on show
function showPicked() {
  $("pick").replaceChildren(icon("day", 16), day ? shortDay.format(new Date(dayStart(day))) : "Calendar");
}
function closeCalendar() {
  $("calendar").hidden = true;
  $("pick").setAttribute("aria-expanded", "false");
}
function openCalendar() {
  const at = new Date(dayStart(day || dayKey(new Date())));
  calendarMonth = new Date(at.getFullYear(), at.getMonth(), 1);
  drawCalendar();
  $("calendar").hidden = false;
  $("pick").setAttribute("aria-expanded", "true");
  ($("calendar").querySelector(".picked") || $("calendar").querySelector("button"))?.focus();
}
function drawCalendar() {
  const known = new Map(days.map((d) => [d.day, d]));
  // Shade against a busy day, not the single busiest, so one marathon does not flatten the rest.
  const sizes = days.map((d) => d.lines).sort((a, b) => a - b);
  const busy = sizes.length ? Math.max(1, sizes[Math.floor(0.9 * (sizes.length - 1))]) : 1;
  const year = calendarMonth.getFullYear(), month = calendarMonth.getMonth();
  let firstDay = 7;  // Sunday, unless the reader's locale says otherwise
  try { firstDay = new Intl.Locale(navigator.language).weekInfo?.firstDay ?? 7; } catch { /* keep Sunday */ }
  const lead = (new Date(year, month, 1).getDay() - (firstDay % 7) + 7) % 7;
  const count = new Date(year, month + 1, 0).getDate();
  const today = dayKey(new Date());

  const detail = el("div", { className: "detail" });
  const describe = (key) => {
    const d = known.get(key), date = new Date(dayStart(key));
    const head = el("b", { textContent: longDay.format(date) });
    if (!d) { detail.replaceChildren(head, el("p", { textContent: "Nothing recorded." })); return; }
    const what = d.talks ? `${d.talks} conversation${d.talks === 1 ? "" : "s"}` : `${d.lines} line${d.lines === 1 ? "" : "s"}`;
    detail.replaceChildren(head, el("small", { textContent: what }),
      el("p", { className: d.headline ? "said" : "", textContent: d.headline || "No recap written for this day." }));
  };
  const idle = () => {
    if (day && new Date(dayStart(day)).getFullYear() === year && new Date(dayStart(day)).getMonth() === month) describe(day);
    else detail.replaceChildren(el("p", { textContent: "Point at a day to see what it was about." }));
  };

  const grid = el("div", { className: "month", role: "grid" });
  for (let n = 0; n < 7; n++) grid.append(el("span", { className: "dow", textContent: weekdayName.format(new Date(2023, 0, 1 + ((firstDay % 7) + n) % 7)) }));
  for (let n = 0; n < lead; n++) grid.append(el("span"));
  for (let n = 1; n <= count; n++) {
    const key = `${year}-${pad(month + 1)}-${pad(n)}`, d = known.get(key);
    const level = d ? Math.max(1, Math.min(4, Math.ceil(4 * d.lines / busy))) : 0;
    const cell = el("button", { textContent: String(n), className: `l${level}${key === day ? " picked" : ""}${key === today ? " today" : ""}`, disabled: !d });
    cell.setAttribute("aria-label", `${longDay.format(new Date(year, month, n))}${d ? `, ${d.lines} lines` : ", nothing recorded"}`);
    if (d) {
      cell.addEventListener("click", () => { closeCalendar(); openDay(key); });
      cell.addEventListener("mouseenter", () => describe(key));
      cell.addEventListener("focus", () => describe(key));
    }
    grid.append(cell);
  }
  grid.addEventListener("mouseleave", idle);

  const turn = (by, label, text) => {
    const b = el("button", { className: "step", textContent: text, ariaLabel: label });
    b.addEventListener("click", (e) => { e.stopPropagation(); calendarMonth = new Date(year, month + by, 1); drawCalendar(); });
    return b;
  };
  const months = days.map((d) => d.day.slice(0, 7));
  const here = `${year}-${pad(month + 1)}`;
  const earlier = turn(-1, "Previous month", "‹"), later = turn(1, "Next month", "›");
  earlier.disabled = !months.some((m) => m < here);
  later.disabled = !months.some((m) => m > here);
  $("calendar").replaceChildren(
    el("div", { className: "top" }, earlier, el("b", { textContent: monthName.format(calendarMonth) }), later),
    grid,
    el("div", { className: "key", ariaHidden: "true" }, "less", ...[1, 2, 3, 4].map((l) => el("i", { className: `l${l}` })), "more said"),
    detail);
  idle();
}

/* A run of stray moments, folded into one row that opens to show them. */
function scraps(run) {
  const cards = run.map((g) => card(g));
  const first = clock.format(new Date(run[0].start)), last = clock.format(new Date(run[run.length - 1].start));
  const said = run.map((g) => g.own.map((u) => u.text).join(" ")).join(" · ");
  const key = `s${run[0].key}`;
  const box = el("details", { className: "scraps" },
    el("summary", {},
      el("span", {}),
      el("span", {},
        el("b", { textContent: `${run.length} short moment${run.length === 1 ? "" : "s"}` }),
        ` ${run.length === 1 || first === last ? first : `${first} to ${last}`}`,
        el("small", { textContent: said.length > 90 ? `${said.slice(0, 90)}…` : said }))),
    ...cards);
  box.addEventListener("toggle", () => { if (box.open) openCards.add(key); else openCards.delete(key); });
  if (openCards.has(key)) box.open = true;
  // Opening one of its moments (to show a search hit, say) opens the fold too.
  for (const g of run) {
    const inner = g.setOpen;
    g.setOpen = (open) => { if (open) box.open = true; inner(open); };
  }
  return box;
}

/* Beside the conversations: what from this day is still to be done. */
function followUps() {
  const open = groups.flatMap((g) => g.reminders
    .filter((r) => r.status === "suggested" || r.status === "accepted").map((r) => ({ r, g })));
  if (!open.length) return [];
  const list = el("ul", { className: "plain" });
  for (const { r, g } of open) {
    const go = el("button", {}, el("span", { textContent: r.text }),
      el("small", { textContent: `${clock.format(new Date(g.start))}${r.status === "suggested" ? ", to review" : ""}` }));
    go.addEventListener("click", () => {
      if (r.line && g.own.some((u) => u.id === r.line)) reveal(r.line, true);
      else { g.setOpen(true); $(`g${g.key}`).scrollIntoView({ block: "start" }); }
    });
    list.append(el("li", {}, go));
  }
  return [el("section", {}, el("h3", { textContent: "To follow up" }), list)];
}

/* Beside the conversations: the named people heard this day, by how long they spoke. */
function people() {
  const heard = new Map();
  for (const g of groups) {
    for (const u of g.own) {
      if (!u.speaker || u.speaker.id === null) continue;
      const p = heard.get(u.speaker.id) || { speaker: u.speaker, ms: 0, first: g };
      p.ms += Math.max(0, u.end - u.start);
      heard.set(u.speaker.id, p);
    }
  }
  if (!heard.size) return [];
  const list = el("ul", { className: "plain" });
  for (const p of [...heard.values()].sort((a, b) => b.ms - a.ms)) {
    const go = el("button", { title: `Open the first conversation with ${p.speaker.name}` },
      el("span", {}, el("i", { className: "dot" }), p.speaker.name),
      el("small", { textContent: p.ms < 60000 ? "under a minute" : `${lengthOf(p.ms)} speaking` }));
    go.style.setProperty("--who", `var(--who-${whoIndex(p.speaker)})`);
    go.addEventListener("click", () => { p.first.setOpen(true); $(`g${p.first.key}`).scrollIntoView({ block: "start" }); });
    list.append(el("li", {}, go));
  }
  return [el("section", {}, el("h3", { textContent: "People" }), list)];
}

function renderDay() {
  // The year is in the date field beside it; only spell it out for other years.
  const shown = new Date(dayStart(day));
  $("title").textContent = (shown.getFullYear() === new Date().getFullYear() ? thisYearDay : longDay).format(shown);
  document.title = `Lifelog, ${day}`;
  showPicked();
  const known = days.map((d) => d.day);
  $("prev").disabled = !known.some((d) => d < day);
  $("next").disabled = !known.some((d) => d > day);

  if (!lines.length) {
    groups = [];
    drawStrip();
    main.replaceChildren(el("div", { className: "empty" },
      el("p", { textContent: "Nothing was said on this day, or nothing has been synced yet." }),
      ...(days.length ? [el("p", {}, "To bring in new audio from the pendant, run ", el("code", { textContent: "limitful watch" }), ", or use Sync now under Settings.")]
        : [(() => { const b = el("button", { className: "pill main", textContent: "Set up Limitful" }); b.addEventListener("click", () => showWelcome()); return b; })()])));
    return;
  }
  groups = buildGroups();
  drawStrip();
  const toggleAll = el("button", { id: "all", textContent: "Open all" });
  toggleAll.addEventListener("click", () => {
    const open = toggleAll.textContent === "Open all";
    groups.forEach((g) => g.setOpen(open));
    toggleAll.textContent = open ? "Close all" : "Open all";
  });
  // A few stray words with no title are not a conversation: fold runs of them into one quiet row,
  // unless they are all the day has.
  const stray = (g) => !g.title && g.own.length <= 3 && g.own.reduce((n, u) => n + u.text.split(/\s+/).length, 0) < 25;
  const fold = groups.some((g) => !stray(g));
  const longest = Math.max(1, ...groups.map((g) => g.end - g.start));
  const rows = [];
  let run = [], strays = 0;
  const flush = () => { if (run.length) { rows.push(scraps(run)); strays += run.length; run = []; } };
  for (const g of groups) {
    if (fold && stray(g)) run.push(g);
    else { flush(); rows.push(card(g, longest)); }
  }
  flush();
  const real = groups.length - strays;
  const count = `${real} conversation${real === 1 ? "" : "s"}${strays ? `, ${strays} short moment${strays === 1 ? "" : "s"}` : ""}`;
  toggleAll.addEventListener("click", () => {
    const open = toggleAll.textContent === "Close all";  // the label has just flipped
    document.querySelectorAll(".scraps").forEach((box) => { box.open = open; });
  });
  const recap = el("section", { className: "recap", hidden: true });
  const side = [recap, ...followUps(), ...people()];
  const grid = el("div", { className: "daygrid" },
    el("div", { className: "talks" }, el("div", { className: "tools" }, el("span", { textContent: count }), toggleAll), ...rows),
    el("aside", { className: "glance", ariaLabel: "This day at a glance" }, ...side));
  main.replaceChildren(grid);
  // With nothing to put beside them, the conversations take the full width.
  const solo = () => grid.classList.toggle("solo", recap.hidden && side.length === 1);
  solo();
  showRecap(recap, day).then(solo);
  if (groups.length === 1) groups[0].setOpen(true);
  markPlaying();
  if (wanted) {
    const { line, talk, start } = wanted;
    wanted = null;
    document.querySelectorAll(".found").forEach((n) => n.classList.remove("found"));
    let from = null;  // the line to start playing at, when asked to
    if (line && groups.some((g) => g.own.some((u) => u.id === line))) {
      reveal(line, true);
      from = lines.find((u) => u.id === line);
    } else if (talk) {
      const g = groups.find((x) => x.key === `c${talk}`);
      if (g) {
        g.setOpen(true);
        $(`g${g.key}`).scrollIntoView({ block: "start" });
        from = g.own.find((u) => u.audio);
      }
    }
    if (start && from) play(from);
  }
}

/* The strip under the header: bars for how much was said in each five minutes, a line under
   each conversation, hour marks, and a playhead. It zooms to the part of the day with speech. */
const HOUR_MS = 3600000, BUCKET_MS = 300000;
const hourLabel = new Intl.DateTimeFormat([], { hour: "numeric" });
let span = { from: 0, to: 1 };  // the stretch of time the strip covers
const along = (ms) => `${((ms - span.from) / (span.to - span.from)) * 100}%`;

function drawStrip() {
  const midnight = dayStart(day);
  let from = midnight + 8 * HOUR_MS, to = midnight + 20 * HOUR_MS;
  if (lines.length) {
    from = Math.floor(lines[0].start / HOUR_MS) * HOUR_MS;
    to = Math.ceil(lines.reduce((m, u) => Math.max(m, u.end), 0) / HOUR_MS) * HOUR_MS;
    // Keep at least six hours in view so a short day does not become one fat bar.
    for (let grow = 0; to - from < 6 * HOUR_MS && grow < 12; grow++) { if (grow % 2) from -= HOUR_MS; else to += HOUR_MS; }
  }
  span = { from, to };

  const count = Math.round((to - from) / BUCKET_MS);
  const spoken = new Array(count).fill(0);
  for (const u of lines) {
    const end = Math.min(Math.max(u.end, u.start + 1000), to);
    for (let b = Math.max(0, Math.floor((u.start - from) / BUCKET_MS)); b < count && from + b * BUCKET_MS < end; b++) {
      spoken[b] += Math.min(end, from + (b + 1) * BUCKET_MS) - Math.max(u.start, from + b * BUCKET_MS);
    }
  }
  const step = (to - from) <= 8 * HOUR_MS ? 1 : (to - from) <= 16 * HOUR_MS ? 2 : 3;
  const marks = [];
  for (let t = from; t <= to; t += step * HOUR_MS) marks.push(t);

  const nodes = marks.slice(1, -1).map((t) => { const n = el("s", { className: "tick" }); n.style.left = along(t); return n; });
  spoken.forEach((ms, b) => {
    if (!ms) return;
    const bar = el("i", { className: "bar" });
    bar.dataset.at = from + b * BUCKET_MS;
    bar.style.left = `calc(${(b / count) * 100}% + 0.5px)`;
    bar.style.width = `calc(${100 / count}% - 1px)`;
    // Square root, so a few words in five minutes still shows.
    bar.style.height = `calc((100% - 8px) * ${0.12 + 0.88 * Math.sqrt(Math.min(1, ms / BUCKET_MS))})`;
    nodes.push(bar);
  });
  for (const g of groups) {
    const line = el("b", { className: g.title ? "talk" : "talk loose" });
    line.dataset.key = g.key;
    line.style.left = along(g.start);
    line.style.width = `${((Math.max(g.end, g.start + 60000) - g.start) / (to - from)) * 100}%`;
    nodes.push(line);
  }
  nodes.push(el("u", { id: "head", hidden: true }), el("div", { id: "tip", hidden: true }));
  strip.replaceChildren(...nodes);

  $("hours").replaceChildren(...marks.map((t, i) => {
    const label = el("span", { textContent: hourLabel.format(new Date(t)) });
    label.style.left = along(t);
    label.style.transform = i === 0 ? "none" : i === marks.length - 1 ? "translateX(-100%)" : "translateX(-50%)";
    return label;
  }));
}

/* Hovering the strip names the conversation under the pointer and lights up its bars. */
function groupAt(ms) { return groups.find((g) => ms >= g.start && ms <= Math.max(g.end, g.start + 60000)); }
strip.addEventListener("mousemove", (e) => {
  const tip = $("tip");
  if (!tip || !lines.length) return;
  const box = strip.getBoundingClientRect();
  const x = Math.min(Math.max(0, e.clientX - box.left), box.width);
  const at = span.from + (x / box.width) * (span.to - span.from);
  const g = groupAt(at);
  strip.classList.toggle("over", Boolean(g));
  strip.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
  if (g) {
    strip.querySelectorAll(".bar").forEach((bar) => {
      const t = Number(bar.dataset.at);
      if (t + BUCKET_MS > g.start && t <= g.end) bar.classList.add("hot");
    });
    strip.querySelector(`.talk[data-key="${g.key}"]`)?.classList.add("hot");
  }
  const first = g ? g.own[0].text : "";
  const name = g ? (g.title || (first.length > 60 ? `${first.slice(0, 60)}…` : first)) : "quiet";
  tip.replaceChildren(el("b", { textContent: clock.format(new Date(g ? g.start : at)) }), name);
  tip.hidden = false;
  tip.style.left = `${Math.min(Math.max(x, 90), box.width - 90)}px`;
});
strip.addEventListener("mouseleave", () => {
  strip.classList.remove("over");
  strip.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
  if ($("tip")) $("tip").hidden = true;
});

/* The day's conversations: summarised ones, plus runs of lines that have no summary. */
function buildGroups() {
  const out = [], taken = new Set();
  for (const t of talks) {
    const own = lines.filter((u) => u.start >= t.start && u.start <= t.end);
    if (!own.length) continue;
    own.forEach((u) => taken.add(u.id));
    out.push({ ...t, key: `c${t.id}`, own });
  }
  let run = null;
  for (const u of lines) {
    if (taken.has(u.id)) { run = null; continue; }
    if (!run || u.start - run.end > TALK_GAP_MS) {
      run = { key: `l${u.start}`, start: u.start, end: u.end, title: null, summary: [], sections: [], reminders: [], own: [] };
      out.push(run);
    }
    run.own.push(u);
    run.end = Math.max(run.end, u.end);
  }
  return out.sort((x, y) => x.start - y.start);
}

function lengthOf(ms) {
  const min = Math.round(ms / 60000);
  if (min < 1) return "under a minute";
  if (min < 60) return `${min} min`;
  return `${Math.floor(min / 60)} h${min % 60 ? ` ${min % 60} min` : ""}`;
}

/* A conversation, closed until clicked. The bar under its time shows how long it ran,
   against the day's longest. */
function card(g, longest = 0) {
  const first = g.own[0].text;
  const title = g.title || (first.length > 70 ? `${first.slice(0, 70)}…` : first);
  const waiting = g.reminders.filter((r) => r.status === "suggested").length;
  const meta = [lengthOf(g.end - g.start), `${g.own.length} line${g.own.length === 1 ? "" : "s"}`];
  if (waiting) meta.push(`${waiting} reminder${waiting === 1 ? "" : "s"} to review`);
  const body = el("div", { className: "body" });
  const length = el("i", { className: "len", hidden: !longest, title: lengthOf(g.end - g.start) });
  if (longest) length.style.width = `${Math.max(6, 100 * (g.end - g.start) / longest)}%`;
  const box = el("details", { className: "card", id: `g${g.key}` },
    el("summary", {},
      el("div", { className: "when" }, el("time", { textContent: clock.format(new Date(g.start)) }), length),
      el("div", {},
        el("h2", { textContent: title, className: g.title ? "" : "untitled" }),
        el("p", { className: "meta", textContent: meta.join(", ") }))),
    body);
  // The transcript is only built when the card is first opened: days can hold thousands of lines.
  const fill = () => { if (!body.childElementCount) { body.append(...cardBody(g)); markPlaying(); } };
  box.addEventListener("toggle", () => {
    if (box.open) { openCards.add(g.key); fill(); } else openCards.delete(g.key);
  });
  g.setOpen = (open) => { if (open) { openCards.add(g.key); fill(); } else openCards.delete(g.key); box.open = open; };
  if (openCards.has(g.key)) g.setOpen(true);
  return box;
}

/* One thing somebody said, set inline so a speaker's turn reads as a paragraph. Click to play. */
function saying(u) {
  const node = el("span", { className: "say", id: `u${u.id}`, textContent: u.text, title: clockSec.format(new Date(u.start)) });
  if (!u.audio) { node.classList.add("mute"); return node; }
  node.tabIndex = 0;
  node.setAttribute("role", "button");
  node.addEventListener("click", () => play(u));
  node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(u); } });
  return node;
}

const TURN_PAUSE_MS = 3000, TURN_CHARS = 480;  // a pause, or this much text, starts a new paragraph

function cardBody(g) {
  const nodes = [];
  // What the conversation came to, before the words themselves.
  const brief = el("div", { className: "brief" });
  if (!g.sections.length && g.summary.length) brief.append(el("ul", {}, ...g.summary.map((t) => el("li", { textContent: t }))));
  const open = g.reminders.filter((r) => r.status === "suggested" || r.status === "accepted");
  brief.append(...open.map((r) => {
    let jump = null;
    if (r.line && g.own.some((u) => u.id === r.line)) {
      jump = el("button", { className: "jump", textContent: "Play the line" });
      jump.addEventListener("click", () => {
        reveal(r.line, true);
        const from = lines.find((u) => u.id === r.line);
        if (from) play(from);
      });
    }
    return todoRow(r, () => { renderDay(); countReminders(); }, jump);
  }));
  if (brief.childElementCount) nodes.push(brief);

  const copy = el("button", { className: "copy", textContent: "Copy as Markdown" });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(asMarkdown(g)); copy.textContent = "Copied"; }
    catch { copy.textContent = "Could not copy"; }
    setTimeout(() => { copy.textContent = "Copy as Markdown"; }, 2000);
  });
  nodes.push(copy);

  const labelled = g.own.some((u) => u.speaker);
  const tint = tinter();
  const who = (x) => x.speaker ? (x.speaker.id ?? x.speaker.name) : 0;
  const headings = [...g.sections];
  let turn = null, chars = 0, lastTimed = null;
  g.own.forEach((u, n) => {
    const before = g.own[n - 1];
    let fresh = !before;
    while (headings.length && headings[0].start <= u.start) {
      const heading = headings.shift();
      nodes.push(el(heading.level === 2 ? "h3" : "h4", { textContent: heading.title }));
      fresh = true;
    }
    const gap = before && u.start - before.end > QUIET_MS;
    if (gap) nodes.push(el("div", { className: "quiet", textContent: quietFor(u.start - before.end) }));
    const changed = fresh || gap || who(before) !== who(u);
    const colour = tint(u.speaker);
    // Say who is speaking whenever it changes, and at the top of each section.
    if (labelled && changed) nodes.push(whoRow(u.speaker, colour));
    // A turn runs on as one paragraph until the speaker changes, pauses, or has said a good deal.
    if (changed || !turn || u.start - before.end > TURN_PAUSE_MS || chars > TURN_CHARS) {
      const minute = Math.floor(u.start / 60000);
      const text = el("p", {});
      turn = el("div", { className: "turn" },
        el("time", { textContent: minute === lastTimed ? "" : clock.format(new Date(u.start)) }), text);
      lastTimed = minute;
      if (colour) { turn.classList.add("tinted"); turn.style.setProperty("--who", colour); }
      nodes.push(turn);
      chars = 0;
    }
    turn.lastChild.append(saying(u), " ");
    chars += u.text.length;
  });
  return nodes;
}

function asMarkdown(g) {
  const out = [`# ${g.title || "Conversation"}`, ""];
  const headings = [...g.sections];
  for (const u of g.own) {
    while (headings.length && headings[0].start <= u.start) {
      const heading = headings.shift();
      out.push("", `${"#".repeat(heading.level)} ${heading.title}`, "");
    }
    out.push(`- **${clockSec.format(new Date(u.start))}** ${u.speaker ? `${u.speaker.name}: ` : ""}${u.text}`);
  }
  return out.join("\n") + "\n";
}

/* Open the card holding a line and bring the line into view. */
function reveal(id, mark) {
  const g = groups.find((x) => x.own.some((u) => u.id === id));
  if (!g) return;
  g.setOpen(true);
  const node = $(`u${id}`);
  if (!node) return;
  node.scrollIntoView({ block: "center" });
  if (mark) node.classList.add("found"); else node.focus({ preventScroll: true });
}

async function openDay(key, revealId, revealTalk, startPlaying) {
  leaveWelcome();
  main.classList.remove("wide");
  document.querySelector("header").classList.remove("plain");
  searching = false;
  reminding = false;
  configuring = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");
  $("remind").setAttribute("aria-pressed", "false");
  $("settings").setAttribute("aria-pressed", "false");
  $("search").value = "";
  day = key;
  wanted = revealId || revealTalk
    ? { line: revealId || null, talk: revealTalk || null, start: Boolean(startPlaying) } : null;
  history.replaceState(null, "", `#${key}`);
  try {
    [lines, talks] = await Promise.all([get(`/api/day/${key}`), get(`/api/conversations/${key}`)]);
    renderDay();
  } catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load this day. ${err.message}` }));
  }
}

function step(direction) {
  const known = days.map((d) => d.day);
  const target = direction < 0
    ? known.filter((d) => d < day).pop()
    : known.find((d) => d > day);
  if (target) openDay(target);
}

async function runSearch(query) {
  leaveWelcome();
  main.classList.remove("wide");
  document.querySelector("header").classList.add("plain");
  searching = true;
  reminding = false;
  configuring = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");
  $("remind").setAttribute("aria-pressed", "false");
  $("settings").setAttribute("aria-pressed", "false");
  $("title").textContent = "Search";
  strip.replaceChildren();
  let results;
  try {
    results = await get(`/api/search?q=${encodeURIComponent(query)}`);
  } catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Search failed. ${err.message}` }));
    return;
  }
  if ($("search").value.trim() !== query) return;  // a newer search is on its way
  const listed = (lines) => {
    const nodes = [];
    let last = null, moment;
    for (const u of lines) {
      // A new day gets its date; a new moment (a few lines that belong together) too.
      if (u.day !== last || u.moment !== moment) {
        last = u.day;
        moment = u.moment;
        const a = el("a", { href: `#${u.day}`, textContent: longDay.format(new Date(dayStart(u.day))) });
        a.addEventListener("click", (e) => { e.preventDefault(); openDay(u.day); });
        nodes.push(el("h2", {}, a));
      }
      nodes.push(lineButton(u, u.day));
    }
    return nodes;
  };
  main.replaceChildren(...(results.length ? listed(results)
    : [el("p", { className: "empty", textContent: `Nothing found for “${query}”.` })]));
  /* Lines that say it in other words, if the index has been built (Settings). They go
     under the exact matches, labelled, so those are never pushed down or mixed up. */
  let near;
  try {
    near = await get(`/api/search/meaning?q=${encodeURIComponent(query)}`);
  } catch (err) {
    return;  // the exact matches are already on the page
  }
  if (!searching || $("search").value.trim() !== query) return;
  const exact = new Set(results.map((u) => u.id));
  const shown = new Set(near.lines.filter((u) => exact.has(u.id)).map((u) => u.moment));
  const extra = near.lines.filter((u) => !shown.has(u.moment));  // moments not already listed above
  if (!extra.length) return;
  main.append(
    el("p", { className: "near", textContent: "Close in meaning, closest first. These moments may not contain your words." }),
    ...listed(extra));
}

/* Playback. One audio element plays a "track": the recordings behind one conversation,
   end to end, so the timeline covers the whole conversation and not one short file. */
let track = null;  // { key, last, pieces: [{ audio, from, to, base }], total, at }
const seek = $("seek");
let scrubbing = false;

function buildTrack(u) {
  const g = groups.find((x) => x.own.some((v) => v.id === u.id));
  const own = (g ? g.own : [u]).filter((v) => v.audio);
  const pieces = [];
  for (const v of own) {
    const from = v.offset / 1000, to = (v.offset + (v.end - v.start)) / 1000 + 1;
    const last = pieces[pieces.length - 1];
    if (last && last.audio === v.audio) last.to = Math.max(last.to, to);
    else pieces.push({ audio: v.audio, from, to });
  }
  let base = 0;
  for (const p of pieces) { p.base = base; base += p.to - p.from; }
  return { key: g ? g.key : `u${u.id}`, last: own[own.length - 1], pieces, total: base, at: 0 };
}

/* Move the audio element to a time in a recording, loading the file if needed. */
function cue(path, time, start) {
  const go = () => { audio.currentTime = time; if (start) audio.play(); };
  if (audio.dataset.src !== path) {
    audio.dataset.src = path;
    audio.src = path;
    audio.addEventListener("loadedmetadata", go, { once: true });
  } else go();
}

function play(u) {
  if (!u.audio) return;  // imported line with no recording
  playing = u;
  const g = groups.find((x) => x.own.some((v) => v.id === u.id));
  if (!track || track.key !== (g ? g.key : `u${u.id}`)) track = buildTrack(u);
  track.at = Math.max(0, track.pieces.findIndex((p) => p.audio === u.audio));
  cue(u.audio, u.offset / 1000, true);
  markPlaying();
  showPosition();
}

/* Where we are in the conversation, in seconds from its start. */
function position() {
  const p = track.pieces[track.at];
  return p.base + Math.min(Math.max(0, audio.currentTime - p.from), p.to - p.from);
}

function jumpTo(seconds) {
  if (!track) return;
  const want = Math.min(Math.max(0, seconds), Math.max(0, track.total - 0.3));
  let i = track.pieces.findIndex((p) => want < p.base + (p.to - p.from));
  if (i < 0) i = track.pieces.length - 1;
  const p = track.pieces[i];
  track.at = i;
  cue(p.audio, p.from + (want - p.base), !audio.paused);
}

/* The end of a recording, or of this conversation's part of it: carry on with what follows. */
function advance() {
  if (track.at + 1 < track.pieces.length) {
    track.at += 1;
    const p = track.pieces[track.at];
    cue(p.audio, p.from, true);
    return;
  }
  const next = lines.find((u) => u.audio && u.start > track.last.start);
  if (next) play(next); else { playing = null; track = null; markPlaying(); }
}

/* The amber line on the strip showing where playback is in the day. */
function movePlayhead() {
  const head = $("head");
  if (!head) return;
  const here = playing && lines.some((u) => u.id === playing.id) && playing.start >= span.from && playing.start <= span.to;
  head.hidden = !here;
  if (here) head.style.left = along(playing.start);
}

function markPlaying() {
  document.querySelectorAll(".on").forEach((n) => n.classList.remove("on"));
  $("player").hidden = !playing;
  if (!playing) movePlayhead();
  document.body.style.setProperty("--player", playing ? "6.2rem" : "0px");
  if (!playing) return;
  $(`u${playing.id}`)?.classList.add("on");
  movePlayhead();
  const t = new Date(playing.start);
  $("now").replaceChildren(el("time", { textContent: clockSec.format(t) }), playing.text);
}

const stamp = (seconds) => {
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
};

function showPosition() {
  if (!track) return;
  seek.max = track.total;
  $("total").textContent = stamp(track.total);
  if (scrubbing) return;  // the reader's hand wins over the playhead
  const at = position();
  seek.value = at;
  $("at").textContent = stamp(at);
  seek.setAttribute("aria-valuetext", `${stamp(at)} of ${stamp(track.total)}`);
}

audio.addEventListener("timeupdate", () => {
  if (!playing || !track) return;
  const piece = track.pieces[track.at];
  if (!audio.seeking && audio.dataset.src === piece.audio && audio.currentTime > piece.to + 0.25) {
    advance();
    return;
  }
  const at = audio.currentTime * 1000;
  const same = lines.filter((u) => u.audio === audio.dataset.src && u.offset <= at + 150);
  const current = same[same.length - 1];
  if (current && current.id !== playing.id) { playing = current; markPlaying(); }
  showPosition();
});
audio.addEventListener("seeked", showPosition);
audio.addEventListener("ended", () => { if (track) advance(); });
audio.addEventListener("play", () => { $("toggle").textContent = "Pause"; });
audio.addEventListener("pause", () => { $("toggle").textContent = "Play"; });
audio.addEventListener("error", () => {
  if (!playing) return;
  $("now").textContent = "This recording could not be played. Chrome and Firefox play these files; older Safari does not.";
});
$("toggle").addEventListener("click", () => audio.paused ? audio.play() : audio.pause());
seek.addEventListener("input", () => { scrubbing = true; $("at").textContent = stamp(seek.value); });
seek.addEventListener("change", () => { scrubbing = false; jumpTo(Number(seek.value)); });
$("back").addEventListener("click", () => jumpTo(position() - 10));
$("ahead").addEventListener("click", () => jumpTo(position() + 10));

strip.addEventListener("click", (e) => {
  if (!lines.length) return;
  const box = strip.getBoundingClientRect();
  const at = span.from + ((e.clientX - box.left) / box.width) * (span.to - span.from);
  // Inside a conversation, go to its start; otherwise to the nearest line.
  const g = groupAt(at);
  const nearest = g ? g.own[0] : lines.reduce((a, b) => Math.abs(b.start - at) < Math.abs(a.start - at) ? b : a);
  reveal(nearest.id, false);
});

/* Importing a Limitless export, and the slower speaker recognition that follows it. */
function say(text, failed) {
  const box = $("status");
  box.hidden = !text;
  box.textContent = text || "";
  box.classList.toggle("failed", Boolean(failed));
}

let watching = null;
async function watchJob() {
  let job;
  try { job = await get("/api/status"); } catch { return; }
  document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = job.running; });
  if (job.running) {
    say(job.total ? `${job.what}: ${job.done} of ${job.total}. You can keep using the page.` : `${job.what}…`);
    if (job.stoppable && !job.what.includes("stopping")) {
      const halt = el("button", { className: "halt" }, ...withIcon("stop", "Stop", 14));
      halt.addEventListener("click", async () => {
        halt.disabled = true;
        try { await post("/api/upkeep", { action: "stop" }); } catch { /* it finished first */ }
        watchJob();
      });
      $("status").append(" ", halt);
    }
    if (!watching) watching = setInterval(watchJob, 3000);
    return;
  }
  if (watching) {
    clearInterval(watching);
    watching = null;
    say(job.error || job.note || "Finished.", Boolean(job.error));
    if (configuring) showSettings();
    days = await get("/api/days");
    if (!searching && !reminding && !configuring && !asking && !welcoming) openDay(day);
  } else if (job.error) {
    say(job.error, true);
  }
}

$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = true; });
  say(`Importing ${file.name}. Large exports take a minute; keep this page open.`);
  try {
    const res = await fetch("/api/import", { method: "POST", headers: { "Content-Type": "application/zip" }, body: file });
    if (!res.ok) throw new Error(await res.text());
    const r = await res.json();
    const added = r.conversations
      ? `Imported ${r.conversations} conversations, ${r.lines} lines and ${r.hours} hours of audio.`
      : "Nothing new in that export.";
    say(r.skipped ? `${added} ${r.skipped} conversations were already here.` : added);
    days = await get("/api/days");
    countReminders();
    if (r.conversations && days.length) openDay(days[days.length - 1].day);
    watchJob();
  } catch (err) {
    say(`Import failed. ${err.message}`, true);
    document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = false; });
  }
});

  lightNote.textContent = pendantNow.brightness == null

    : "Over Bluetooth the pendant does not report its brightness; this is the last value known. Plug it in with a USB cable to read the real value.";
  post("/api/pendant", { action: "usb" }).then(showWired).catch(() => {});  // quick, and silent when not plugged in
  const pick = el("button", { className: "pill busy-off" }, ...withIcon("import", "Choose an export zip", 16));

  const theme = () => { try { return localStorage.getItem("limitful-theme") || ""; } catch { return ""; } };
