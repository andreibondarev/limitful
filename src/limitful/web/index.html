  const themes = el("fieldset", {},
    el("legend", { hidden: true, textContent: "Theme" }),
    themeChoice("", "Match this computer", "Follows your system's light or dark setting."),
    themeChoice("light", "Light", "Pale green paper, dark ink."),
    themeChoice("dark", "Dark", "Dark paper, light ink. Easier in a dim room."));
  themes.addEventListener("change", () => {
    const picked = themes.querySelector("input:checked").value;
    try { if (picked) localStorage.setItem("limitful-theme", picked); else localStorage.removeItem("limitful-theme"); } catch { /* applies until the page closes */ }
    if (picked) document.documentElement.dataset.theme = picked; else delete document.documentElement.dataset.theme;
    restate();
  });
  // One section at a time, picked from a menu that also says where each one stands.
  const panes = {
    pendant: el("section", { className: "setup" },
    el("h2", {}, ...withIcon("pendant", "Pendant", 22)),
    el("p", { textContent: "Sync pulls new audio off the pendant, frees it there, then transcribes and summarises it. The pendant must be near this computer and not connected to a phone." }),
    el("div", { className: "device" },
      drawing,
      el("div", {},
        el("div", { className: "readings" }, power.node, waiting.node, room.node),
        el("div", { className: "row" }, sync, check, pause),
        about,
        wired)),
    hold,
    el("div", { className: "row light" }, el("label", { htmlFor: "light", textContent: "Light" }), icon("dim", 18), light, icon("bright", 20), lightValue),
    lightNote,
    autostartSwitch(),
    el("p", { className: "small", textContent: "Pause stops the app keeping audio; the pendant itself goes on recording. To stop it recording at all, hold its button for two seconds to switch it off." }),
    el("details", { className: "more" },
      el("summary", { textContent: "Pairing" }),
      el("ol", {},
        el("li", { textContent: "Sync first. Pairing mode is a factory reset: it erases any audio still on the pendant." }),
        el("li", { textContent: "Click Pair this computer. It waits three minutes." }),
        el("li", { textContent: "On the pendant, press the button once and release, then straight away press and hold. A purple light appears; keep holding until it goes out." }),
        el("li", { textContent: "A blue light means it is ready. Accept the connection request your computer shows." })),
      el("p", { className: "small", textContent: "Unpair makes the pendant forget this computer, so it can be paired with another. Its recordings are kept. Your computer may also remember the pendant: if pairing again fails, remove it under Bluetooth in System Settings." }),
      el("div", { className: "row" }, pair, unpair))),
    transcription: el("section", { className: "setup" },
    el("h2", {}, ...withIcon("wave", "Transcription", 22)),
    el("p", { textContent: "What turns new recordings from the pendant into text. Conversations imported from Limitless keep the transcript they came with." }),
    heard,
    el("div", { className: "row" }, heardSave, dgForget),
    heardNote),
    summaries: el("section", { className: "setup" },
    el("h2", {}, ...withIcon("summary", "Summaries", 22)),
    el("p", { textContent: "A title, a short summary and suggested reminders for each conversation recorded from the pendant, and a recap at the top of each day. Conversations imported from Limitless already have their own titles; an imported day gets a recap only when you ask for one on its page." }),
    options,
    el("div", { className: "row" }, save, run, forget),
    note),
    search: el("section", { className: "setup" },
    el("h2", {}, ...withIcon("find", "Search by meaning", 22)),
    el("p", { textContent: `Lets Ask and the search box find lines by what they mean, not only by their exact words, so "money" can find "budget". It runs on this computer. ${indexState}` }),
    indexing),
    appearance: el("section", { className: "setup" },
      el("h2", {}, ...withIcon("bright", "Appearance", 22)),
      el("p", { textContent: "Light or dark. This is remembered in this browser only." }),
      themes),
    import: el("section", { className: "setup" },
    el("h2", {}, ...withIcon("import", "Import from Limitless", 22)),
    el("p", { textContent: "Bring in a data export: conversations, transcripts, audio and reminders. Importing the same export twice adds nothing." }),
    el("div", { className: "row" }, pick),
    el("h2", {}, ...withIcon("clock", "Timing of imported lines", 22)),
    el("p", { textContent: `Limitless's timestamps run about a second late, so imported lines trail their audio. This listens to each recording and moves every line to where its words are said, keeping Limitless's text. ${retimeState}` }),
    retiming),
  };
  const menu = [
    ["pendant", "pendant", "Pendant", () => pausedSince ? "Paused" : pendantNow.usb && !pendantNow.usb.error ? "Plugged in" : pendantNow.checked && !pendantNow.error ? `${pendantNow.battery}% battery` : "Sync, light, pairing"],
    ["transcription", "wave", "Transcription", () => now.transcriber === "deepgram" ? "Deepgram" : "On this computer"],
    ["summaries", "summary", "Summaries", () => now.provider === "claude" ? "Claude" : now.provider === "ollama" ? "Ollama" : "Off"],
    ["search", "find", "Search by meaning", () => !upkeep.index.total ? "Nothing to index" : !upkeep.index.indexed ? "Not set up" : upkeep.index.left ? `${count(upkeep.index.left)} lines left` : "Up to date"],
    ["appearance", "bright", "Appearance", () => ({ light: "Light", dark: "Dark" })[theme()] || "Matches this computer"],
    ["import", "import", "Import from Limitless", () => upkeep.retime.recordings ? `${count(upkeep.retime.recordings)} recordings to re-time` : "Bring in an export"],
  ];
  const tabs = el("nav", { className: "sections", ariaLabel: "Settings sections" });
  const states = {};
  const open = (id) => {
    settingsPane = id;
    history.replaceState(null, "", `#settings/${id}`);  // so a section can be bookmarked or linked
    for (const [name, pane] of Object.entries(panes)) pane.hidden = name !== id;
    for (const b of tabs.children) b.setAttribute("aria-current", String(b.dataset.pane === id));
  };
  for (const [id, pic, label, state] of menu) {
    states[id] = el("small", { textContent: state() });
    const b = el("button", {}, icon(pic, 18), el("span", {}, el("b", { textContent: label }), states[id]));
    b.dataset.pane = id;
    b.addEventListener("click", () => open(id));
    tabs.append(b);
  }
  restate = () => { for (const [id, , , state] of menu) states[id].textContent = state(); };
  main.classList.add("wide");
  main.replaceChildren(el("div", { className: "settings" }, tabs, el("div", {}, ...Object.values(panes),
    el("p", { className: "about" }, el("b", { textContent: "*" }), " Limitful", el("br"), el("small", { textContent: "limits apply" })),
    (() => { const b = el("button", { className: "pill", textContent: "Set up again" }); b.title = "Run the first-time guide: connect a pendant, import history, choose summaries"; b.addEventListener("click", () => showWelcome()); return el("p", { className: "small" }, b); })())));
  open(panes[settingsPane] ? settingsPane : "pendant");
  showKey();
  showDgKey();
  watchJob();
}
$("settings").addEventListener("click", () => configuring ? openDay(day) : showSettings());

/* Ask: questions about what was said, answered from the transcripts with links to the lines. */
const shortWhen = new Intl.DateTimeFormat([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

/* An answer is plain text with "- " lists, **bold** and [L123] citations. Build it as nodes. */
function replyNodes(text, cited) {
  const inline = (line) => {
    const out = [];
    for (const part of line.split(/(\*\*[^*]+\*\*|\[L\d+\])/)) {
      const ref = part.match(/^\[L(\d+)\]$/);
      if (ref) {
        const where = cited[ref[1]];
        if (!where) continue;  // an id the model was never shown
        const a = el("a", { className: "cite", href: `#${where.day}/${ref[1]}`, title: `“${where.text}”`,
          textContent: shortWhen.format(new Date(where.start)) });
        a.addEventListener("click", (e) => { e.preventDefault(); openDay(where.day, Number(ref[1]), where.conversation, true); });
        out.push(a);
      } else if (/^\*\*[^*]+\*\*$/.test(part)) out.push(el("b", { textContent: part.slice(2, -2) }));
      else if (part) out.push(part);
    }
    return out;
  };
  const nodes = [];
  for (const block of text.split(/\n\s*\n/)) {
    let list = null, para = [];
    const flush = () => { if (para.length) { nodes.push(el("p", {}, ...inline(para.join(" ")))); para = []; } };
    for (const line of block.split("\n")) {
      const item = line.match(/^\s*[-*•]\s+(.*)$/);
      if (item) {
        flush();
        if (!list) { list = el("ul"); nodes.push(list); }
        list.append(el("li", {}, ...inline(item[1])));
      } else { list = null; para.push(line.trim()); }
    }
    flush();
  }
  return nodes;
}

function showAsk() {
  leaveWelcome();
  asking = true;
  searching = false; reminding = false; configuring = false;
  history.replaceState(null, "", "#ask");
  for (const [id, on] of [["ask", true], ["remind", false], ["settings", false]]) $(id).setAttribute("aria-pressed", String(on));
  $("title").textContent = "Ask";
  strip.replaceChildren();
  main.classList.add("wide");
  document.querySelector("header").classList.add("plain");

  const thread = el("div", { className: "thread" });
  const side = el("aside", { className: "side", ariaLabel: "Your chats" });
  const box = el("div", { className: "chat" }, thread, side);
  // What Claude is doing right now, with the mark turning while it works.
  const workingText = el("span");
  const working = el("p", { className: "working", role: "status", hidden: true }, star(20), workingText);
  const tell = (text, { busy = false, failed = false } = {}) => {
    workingText.textContent = text;
    working.hidden = !text;
    working.classList.toggle("busy", busy);
    working.classList.toggle("failed", failed);
  };
  const field = el("textarea", { rows: 1, placeholder: "Ask about anything you've said or heard", ariaLabel: "Your question" });
  const go = el("button", { type: "submit", ariaLabel: "Ask", title: "Ask" }, icon("send", 20));
  const form = el("form", { className: "composer" }, field, go);
  const grow = () => { field.style.height = "auto"; field.style.height = `${Math.min(field.scrollHeight, 192)}px`; };

  const paintSide = () => {
    const fresh = el("button", { className: "pill new", type: "button" }, ...withIcon("plus", "New chat", 16));
    fresh.addEventListener("click", () => { if (!chatBusy) { chat = []; chatId = null; paint(); field.focus(); } });
    const rows = threads.map((t) => {
      const open = el("button", { className: "open", type: "button", textContent: t.title, title: t.title });
      open.addEventListener("click", () => loadThread(t.id));
      const remove = el("button", { className: "remove", type: "button", textContent: "Delete", ariaLabel: `Delete the chat “${t.title}”` });
      remove.addEventListener("click", async () => {
        if (!remove.classList.contains("sure")) { remove.classList.add("sure"); remove.textContent = "Really?"; return; }
        try {
          await post(`/api/chats/${t.id}/delete`, {});
          threads = await get("/api/chats");
          if (t.id === chatId) { chat = []; chatId = null; }
          paint();
        } catch (err) { remove.textContent = "Failed"; }
      });
      const when = `${shortWhen.format(new Date(t.updated))}, ${t.questions} question${t.questions === 1 ? "" : "s"}`;
      return el("div", { className: t.id === chatId ? "row now" : "row" }, open, remove, el("small", { textContent: when }));
    });
    side.replaceChildren(
      el("h3", {}, ...withIcon("chats", "Chats", 16)),
      fresh,
      ...(rows.length ? rows : [el("p", { className: "none", textContent: "Your chats are saved here, on this computer." })]));
  };

  const paint = () => {
    const turns = [];
    for (const turn of chat) {
      if (turn.role === "user") turns.push(el("p", { className: "asked", textContent: turn.content }));
      else turns.push(el("div", { className: "answer" }, star(20), el("div", { className: "reply" }, ...replyNodes(turn.content, turn.lines || {}))));
    }
    const tries = [
      ["reminders", "What did I agree to do this week?"],
      ["people", "Who did I talk to most recently, and about what?"],
      ["day", "What were the main things discussed on my busiest day?"],
    ].map(([name, q]) => {
      const b = el("button", { type: "button" }, icon(name, 20), el("span", { textContent: q }));
      b.addEventListener("click", () => send(q));
      return b;
    });
    const hero = chat.length ? [] : [el("div", { className: "hero" },
      star(64),
      el("h2", { textContent: "What do you want to find?" }),
      el("p", { textContent: "Ask what was said, what you agreed to, or when something came up. Every answer links to the lines it came from, so you can hear the moment." }),
      el("div", { className: "tries" }, ...tries))];
    thread.replaceChildren(...hero, ...turns, working, el("div", { className: "dock" }, form,
      el("p", { className: "fine", textContent: "Your questions and the transcript lines Claude reads are sent to Anthropic." })));
    paintSide();
    grow();
  };

  const loadThread = async (id) => {
    if (chatBusy) return;
    try { chat = await get(`/api/chats/${id}`); chatId = id; tell(""); paint(); field.focus(); }
    catch (err) { tell(`Could not open that chat. ${err.message}`, { failed: true }); }
  };

  const send = async (question) => {
    question = question.trim();
    if (!question || chatBusy) return;
    chatBusy = true;
    chat.push({ role: "user", content: question });
    field.value = "";
    paint();
    go.disabled = true;
    tell("Thinking…", { busy: true });
    working.scrollIntoView({ block: "nearest" });
    let failure = null;
    // The answer appears as it is written. Citations become links once it is complete.
    let draft = "";
    const liveBody = el("div", { className: "reply" });
    const live = el("div", { className: "answer" }, star(20), liveBody);
    const drawDraft = () => {
      const shown = draft.replace(/\[L\d+\]/g, "").replace(/\[L?\d*$/, "").replace(/\*\*?$/, "");
      liveBody.replaceChildren(...replyNodes(shown, {}));
      if (!live.isConnected && shown.trim()) working.before(live);
      if (asking) form.scrollIntoView({ block: "nearest" });
    };
    try {
      const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, chat: chatId }) });
      if (!res.ok) throw new Error(await res.text());
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buffer = "", done = false;
      const take = (line) => {
        if (!line.trim()) return;
        const item = JSON.parse(line);
        if (item.step) tell(`${item.step}…`, { busy: true });
        else if (item.text === null) { draft = ""; live.remove(); }
        else if (typeof item.text === "string") {
          if (!draft) tell("");
          draft += item.text;
          drawDraft();
        }
        else if (item.error) failure = item.error;
        else if (item.answer) {
          chat.push({ role: "assistant", content: item.answer, lines: item.lines });
          chatId = item.chat;
          done = true;
        }
      };
      for (;;) {
        const { value, done: ended } = await reader.read();
        if (value) {
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n");
          buffer = parts.pop();
          parts.forEach(take);
        }
        if (ended) { take(buffer); break; }
      }
      if (!done && !failure) failure = "The answer was cut off. Try again.";
    } catch (err) { failure = err.message; }
    chatBusy = false;
    live.remove();
    if (!failure) { try { threads = await get("/api/chats"); } catch { /* the list catches up next time */ } }
    if (failure) {
      chat.pop();  // the question was not answered; put it back in the box to retry
      if (asking) { paint(); field.value = question; grow(); }
    } else if (asking) paint();
    go.disabled = false;
    tell(failure ? `No answer. ${failure}` : "", { failed: Boolean(failure) });
    if (asking) { (failure ? working : form).scrollIntoView({ block: "nearest" }); field.focus(); }
  };

  form.addEventListener("submit", (e) => { e.preventDefault(); send(field.value); });
  field.addEventListener("input", grow);
  field.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(field.value); }
  });
  paint();
  main.replaceChildren(box);
  get("/api/chats").then((list) => { threads = list; if (asking && !chatBusy) paint(); }).catch(() => {});
  if (chatBusy) { go.disabled = true; tell("Still working on the last question…", { busy: true }); }
  field.focus();
}
$("ask").addEventListener("click", () => asking ? openDay(day) : showAsk());

for (const id of ["ask", "remind", "settings"]) $(id).prepend(icon(id === "remind" ? "reminders" : id, 16));
$("paused").prepend(icon("pause", 16));
$("paused").addEventListener("click", () => showSettings());
/* Show on every page when audio is not being kept: it is easy to forget. */
async function showPaused() {
  try { $("paused").hidden = (await get("/api/pendant")).paused_since == null; } catch { /* leave it as it is */ }
}
$("remind").addEventListener("click", () => reminding ? openDay(day) : showReminders());
$("home").addEventListener("click", (e) => {
  e.preventDefault();
  openDay(days.length ? days[days.length - 1].day : dayKey(new Date()));
});
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("pick").addEventListener("click", () => ($("calendar").hidden ? openCalendar() : closeCalendar()));
document.addEventListener("click", (e) => { if (!$("calendar").hidden && !$("when").contains(e.target)) closeCalendar(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("calendar").hidden) { closeCalendar(); $("pick").focus(); } });

let timer;
$("search").addEventListener("input", (e) => {
  clearTimeout(timer);
  const query = e.target.value.trim();
  timer = setTimeout(() => query ? runSearch(query) : openDay(day), 200);
});

document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input, textarea");
  if (e.key === "Escape" && (searching || reminding || configuring || asking)) { openDay(day); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("search").focus(); }
  else if (e.shiftKey && track && e.key === "ArrowLeft") jumpTo(position() - 10);
  else if (e.shiftKey && track && e.key === "ArrowRight") jumpTo(position() + 10);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === " " && playing && !e.target.matches("button")) { e.preventDefault(); $("toggle").click(); }
});

/* New lines arrive while `limitful watch` runs; pick them up quietly. */
setInterval(async () => {
  showPaused();
  if (searching || reminding || configuring || asking || welcoming || document.hidden || !day) return;
  try {
    days = await get("/api/days");
    const [fresh, freshTalks] = await Promise.all([get(`/api/day/${day}`), get(`/api/conversations/${day}`)]);
    if (fresh.length !== lines.length || freshTalks.length !== talks.length) {
      lines = fresh; talks = freshTalks; renderDay(); countReminders();
    }
  } catch { /* the server is away; try again next time */ }
}, 30000);

/* Following a link or editing the address goes there without a reload. */
window.addEventListener("hashchange", () => {
  const [where, id] = location.hash.slice(1).split("/");
  if (/^\d{4}-\d{2}-\d{2}$/.test(where)) openDay(where, id && Number(id));
  else if (where === "reminders") showReminders();
  else if (where === "settings") { if (id) settingsPane = id; showSettings(); }
  else if (where === "ask") showAsk();
  else if (where === "welcome") showWelcome();
});

(async () => {
  try {
    days = await get("/api/days");
  } catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load recordings. ${err.message}` }));
    return;
  }
  const [hashDay, hashId] = location.hash.slice(1).split("/");
  const start = /^\d{4}-\d{2}-\d{2}$/.test(hashDay) ? hashDay
    : days.length ? days[days.length - 1].day : dayKey(new Date());
  await openDay(start, hashId && Number(hashId));
  if (hashDay === "reminders") showReminders();
  if (hashDay === "settings") { if (hashId) settingsPane = hashId; showSettings(); }
  if (hashDay === "ask") showAsk();
  showDemoBar();
  // An empty Lifelog that has never been set up starts with the guide.
  if (hashDay === "welcome" || (!days.length && !welcomed() && !hashDay)) showWelcome();
  watchJob();
  countReminders();
  showPaused();
})();
