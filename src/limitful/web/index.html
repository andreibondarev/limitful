<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifelog</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22><rect x=%224%22 y=%224%22 width=%22120%22 height=%22120%22 rx=%2228%22 fill=%22%230b6b58%22/><g transform=%22translate(64.0 64.0)%22 fill=%22%23f4c63a%22><path d=%22M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z%22 transform=%22rotate(0)%22/><path d=%22M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z%22 transform=%22rotate(60)%22/><path d=%22M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z%22 transform=%22rotate(120)%22/><path d=%22M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z%22 transform=%22rotate(180)%22/><path d=%22M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z%22 transform=%22rotate(240)%22/><path d=%22M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z%22 transform=%22rotate(300)%22/><circle r=%224.41%22/></g></svg>">
<style>
  :root {
    --paper: #eef2ef;
    --ink: #13201a;
    --muted: #5e6e66;
    --rule: #d0dad3;
    --accent: #0b6b58;
    --mark: #f4c63a;
    --mark-ink: #2a2100;
    --voice: "Charter", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --chrome: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --gutter: 4.75rem;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1613;
      --ink: #e4ece7;
      --muted: #8fa097;
      --rule: #26322c;
      --accent: #63d2b6;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 11rem; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--chrome);
    font-size: 15px;
    line-height: 1.4;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 1.1rem clamp(1rem, 4vw, 3rem) 0.6rem;
  }
  .bar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  h1 {
    font-family: var(--voice);
    font-weight: 400;
    font-size: clamp(1.6rem, 3.6vw, 2.3rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 auto 0 0;
  }
  #home { display: flex; border-radius: 9px; flex: none; }
  #home svg { display: block; }
  #home:hover { filter: brightness(1.12); }
  .step {
    width: 2.25rem; height: 2.25rem;
    border: 1px solid var(--rule); border-radius: 50%;
    background: none; cursor: pointer;
    font-size: 1.1rem; line-height: 1;
  }
  .step:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .step:disabled { opacity: 0.35; cursor: default; }
  #pick, #search {
    border: 1px solid var(--rule); border-radius: 999px;
    background: transparent; padding: 0.4rem 0.85rem;
  }
  #search { width: min(100%, 13rem); }
  #search::placeholder { color: var(--muted); }

  /* The day as a strip: one mark for every stretch of speech. */
  #strip {
    position: relative; height: 1.75rem; margin-top: 0.9rem;
    border-block: 1px solid var(--rule);
    cursor: pointer;
  }
  #strip i {
    position: absolute; top: 3px; bottom: 3px; min-width: 2px;
    background: var(--accent); border-radius: 1px;
  }
  #strip i.on { background: var(--mark); top: 0; bottom: 0; }
  #hours { position: relative; height: 1.1rem; color: var(--muted); font-size: 0.75rem; }
  #hours span { position: absolute; top: 0.15rem; }
  #hours span:not(:first-child) { transform: translateX(-50%); }

  main { padding: 1.5rem clamp(1rem, 4vw, 3rem) 9rem; max-width: 60rem; }
  .line {
    display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr);
    align-items: baseline;
    width: 100%; padding: 0.3rem 0; margin: 0;
    border: 0; background: none; text-align: left; cursor: pointer;
  }
  .line time {
    color: var(--muted); font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }
  .line span {
    font-family: var(--voice); font-size: 1.2rem; line-height: 1.6;
    max-width: 68ch;
    padding: 0 0.3rem; margin-left: -0.3rem; border-radius: 3px;
  }
  .line:hover span { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .line.on span { background: var(--mark); color: var(--mark-ink); }
  .line.mute { cursor: default; }
  .line.found span { box-shadow: 0 0 0 2px var(--accent); }
  .who { margin: 0.75rem 0 0 var(--gutter); font-size: 0.85rem; min-height: 1.5rem; }
  .who button {
    border: 0; background: none; padding: 0; cursor: pointer;
    font-weight: 600; color: var(--accent);
    text-decoration: underline dotted transparent; text-underline-offset: 3px;
  }
  .who button:hover { text-decoration-color: currentColor; }
  .who.unknown { color: var(--muted); }
  .who input {
    border: 1px solid var(--accent); border-radius: 4px; background: transparent;
    padding: 0.1rem 0.4rem; width: 12rem; font-weight: 600;
  }
  .who .here {
    margin-left: 0.5rem; padding: 0.1rem 0.6rem; font-weight: 400; font-size: 0.8rem;
    border: 1px solid var(--rule); border-radius: 999px; color: var(--ink);
  }
  .who small { color: var(--muted); margin-left: 0.6rem; font-size: 0.8rem; }
  .tools {
    display: flex; align-items: center; gap: 1rem;
    margin: 0 0 0.6rem var(--gutter); color: var(--muted); font-size: 0.85rem;
  }
  #all, .copy {
    border: 1px solid var(--rule); border-radius: 999px; background: transparent;
    padding: 0.2rem 0.7rem; cursor: pointer; font-size: 0.85rem;
  }
  #all:hover, .copy:hover { border-color: var(--accent); color: var(--accent); }
  .card { border-top: 1px solid var(--rule); }
  .card > summary {
    display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); align-items: baseline;
    padding: 0.85rem 0; cursor: pointer; list-style: none;
  }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary time { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  .card > summary h2 { margin: 0; font-size: 1.35rem; line-height: 1.25; max-width: 68ch; }
  .card > summary h2.untitled { color: var(--muted); font-style: italic; font-size: 1.12rem; }
  .card > summary:hover h2 { color: var(--accent); }
  .card[open] > summary h2 { color: var(--accent); }
  .card .meta { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .card .body { padding: 0 0 1.4rem; }
  .card .body > ul {
    margin: 0 0 0.6rem var(--gutter); padding-left: 1.1rem; max-width: 68ch;
    color: var(--muted); font-size: 0.95rem; line-height: 1.5;
  }
  .card .body > .todo, .card .copy { margin-left: var(--gutter); }
  .card .copy { margin-top: 0.4rem; }
  .card h3 {
    margin: 1.6rem 0 0.2rem var(--gutter); max-width: 68ch;
    font-family: var(--voice); font-size: 1.18rem; font-weight: 600; line-height: 1.3;
  }
  .card h4 {
    margin: 1rem 0 0.1rem var(--gutter); max-width: 68ch;
    font-size: 0.92rem; font-weight: 600; color: var(--muted);
  }
  .todo {
    display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    margin-top: 0.5rem; padding: 0.45rem 0.7rem;
    border-left: 3px solid var(--mark); background: color-mix(in srgb, var(--mark) 14%, transparent);
    border-radius: 0 4px 4px 0; max-width: 68ch;
  }
  .todo p { margin: 0; flex: 1 1 14rem; }
  .todo small { color: var(--muted); flex-basis: 100%; }
  .todo .where a { color: var(--accent); text-underline-offset: 3px; }
  .todo .where q { display: block; margin-top: 0.2rem; font-family: var(--voice); font-size: 0.95rem; font-style: italic; }
  .todo .jump { border-style: dashed; }
  .todo.accepted { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
  #status {
    margin: 0.7rem 0 0; padding: 0.45rem 0.7rem; font-size: 0.9rem;
    border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent);
  }
  #status.failed { border-left-color: #b3261e; background: color-mix(in srgb, #b3261e 10%, transparent); }
  .todo button, #remind, #settings, #ask, .pill {
    border: 1px solid var(--rule); border-radius: 999px; background: transparent;
    padding: 0.2rem 0.7rem; cursor: pointer; font-size: 0.85rem;
  }
  .todo button:hover, #remind:hover, #settings:hover, .pill:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #remind, #settings, #ask, .pill { padding: 0.4rem 0.85rem; font-size: inherit; }
  #ask:hover { border-color: var(--accent); color: var(--accent); }
  #ask[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chat { max-width: 44rem; }
  .chat .lead { font-family: var(--voice); font-size: 1.2rem; line-height: 1.5; margin: 0 0 1rem; }
  .chat .tries { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  .chat .asked {
    margin: 1.8rem 0 0.7rem; padding-left: 0.9rem; border-left: 3px solid var(--mark);
    font-family: var(--voice); font-size: 1.3rem; line-height: 1.35; white-space: pre-wrap;
  }
  .chat .asked:first-child { margin-top: 0.3rem; }
  .chat .reply { font-family: var(--voice); font-size: 1.12rem; line-height: 1.6; }
  .chat .reply p { margin: 0 0 0.8rem; }
  .chat .reply ul { margin: 0 0 0.8rem; padding-left: 1.2rem; }
  .chat .reply li { margin-bottom: 0.3rem; }
  .chat .cite {
    font-family: var(--chrome); font-size: 0.72rem; font-variant-numeric: tabular-nums; white-space: nowrap;
    margin: 0 0.15rem; padding: 0.05rem 0.4rem; border-radius: 999px; text-decoration: none;
    color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    vertical-align: 0.12em;
  }
  .chat .cite:hover { background: var(--accent); color: var(--paper); }
  .chat .working { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.8rem; }
  .chat .working.failed { color: #b3261e; }
  .chat form { display: flex; gap: 0.6rem; align-items: flex-end; margin-top: 1.6rem; }
  .chat textarea {
    flex: 1; min-height: 2.9rem; max-height: 12rem; resize: vertical; font: inherit; color: inherit;
    font-family: var(--voice); font-size: 1.1rem; line-height: 1.4;
    border: 1px solid var(--rule); border-radius: 10px; background: transparent; padding: 0.6rem 0.8rem;
  }
  .chat textarea::placeholder { color: var(--muted); }
  .chat .fine { margin-top: 0.6rem; color: var(--muted); font-size: 0.8rem; }
  .chat .past { margin-top: 2rem; border-top: 1px solid var(--rule); padding-top: 0.8rem; }
  .chat .past summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; margin-bottom: 0.4rem; }
  .chat .past .row { display: flex; align-items: baseline; gap: 0.8rem; padding: 0.35rem 0; }
  .chat .past .open {
    border: 0; background: none; padding: 0; cursor: pointer; text-align: left; flex: 1;
    font-family: var(--voice); font-size: 1.05rem; color: var(--ink);
  }
  .chat .past .open:hover { color: var(--accent); }
  .chat .past small { color: var(--muted); white-space: nowrap; }
  .chat .past .remove { border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  .chat .past .remove:hover { color: #b3261e; }
  .pill:disabled { opacity: 0.5; cursor: default; }
  .pill.main { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pill.main:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  #settings[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .setup { max-width: 38rem; }
  .setup h2 { margin: 0 0 0.3rem; font-size: 1.45rem; }
  .setup h2:not(:first-child) { margin-top: 2.4rem; }
  .setup > p { margin: 0 0 1rem; color: var(--muted); line-height: 1.5; }
  .setup fieldset { border: 0; margin: 0 0 1rem; padding: 0; }
  .setup label.choice {
    display: grid; grid-template-columns: 1.4rem 1fr; gap: 0 0.4rem; align-items: baseline;
    padding: 0.7rem 0; border-top: 1px solid var(--rule); cursor: pointer;
  }
  .setup label.choice b { font-weight: 600; }
  .setup label.choice span { grid-column: 2; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
  .setup .key { margin: 0 0 1rem 1.8rem; }
  .setup .key label { display: block; font-size: 0.9rem; margin-bottom: 0.25rem; }
  .setup .key input {
    width: min(100%, 24rem); border: 1px solid var(--rule); border-radius: 6px;
    background: transparent; padding: 0.45rem 0.6rem; font-family: ui-monospace, monospace; font-size: 0.85rem;
  }
  .setup .key small { display: block; margin-top: 0.35rem; color: var(--muted); line-height: 1.45; }
  .setup .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .setup .note { margin: 0.7rem 0 0; font-size: 0.9rem; }
  .setup .note.failed { color: #b3261e; }
  .setup .row.light { margin-top: 1.1rem; gap: 0.8rem; }
  .setup .row.light input { flex: 0 1 16rem; accent-color: var(--accent); }
  .setup .row.light output { min-width: 3rem; font-variant-numeric: tabular-nums; }
  .setup .small { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
  .setup .about { margin: 3rem 0 0; font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
  .setup .about b { color: var(--mark); font-size: 1.5em; line-height: 0; vertical-align: -0.18em; }
  .setup .about small { font-size: 0.8rem; font-weight: 400; color: var(--muted); margin-left: 1.45rem; }
  #remind[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .quiet {
    margin: 0.9rem 0 0.9rem var(--gutter);
    color: var(--muted); font-size: 0.82rem;
    display: flex; align-items: center; gap: 0.75rem; max-width: 68ch;
  }
  .quiet::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }
  h2 {
    font-family: var(--voice); font-weight: 400; font-size: 1.25rem;
    margin: 1.75rem 0 0.4rem;
  }
  h2 a { color: var(--accent); text-underline-offset: 3px; }
  .empty { font-family: var(--voice); font-size: 1.2rem; max-width: 34rem; }
  .empty code { font-size: 0.85em; }
  .empty p + p { color: var(--muted); font-family: var(--chrome); font-size: 0.95rem; }

  #player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; flex-direction: column; gap: 0.45rem;
    padding: 0.65rem clamp(1rem, 4vw, 3rem) 0.75rem;
    background: var(--ink); color: var(--paper);
  }
  #transport { display: flex; align-items: center; gap: 0.7rem; }
  #seek { flex: 1; min-width: 5rem; height: 1.4rem; margin: 0; accent-color: var(--mark); cursor: pointer; }
  #at, #total { font-size: 0.82rem; font-variant-numeric: tabular-nums; opacity: 0.8; min-width: 2.6rem; }
  #at { text-align: right; }
  .skip {
    border: 1px solid color-mix(in srgb, var(--paper) 35%, transparent); border-radius: 999px;
    background: transparent; color: inherit; padding: 0.3rem 0.65rem; cursor: pointer;
    font-size: 0.82rem; white-space: nowrap;
  }
  .skip:hover { border-color: var(--mark); color: var(--mark); }
  #player :focus-visible { outline-color: var(--mark); }
  #player[hidden] { display: none; }
  #toggle {
    border: 0; border-radius: 999px; padding: 0.4rem 1rem; cursor: pointer;
    background: var(--mark); color: var(--mark-ink); font-weight: 600;
    min-width: 5.2rem;
  }
  #now { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--voice); font-size: 1.05rem; }
  #now time { font-family: var(--chrome); font-size: 0.82rem; opacity: 0.75; margin-right: 0.6rem; font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    :root { --gutter: 4.4rem; }
    .line span { font-size: 1.08rem; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a id="home" href="#" aria-label="Limitful: go to the latest day" title="Limitful (*limits apply)"><svg viewBox="0 0 128 128" width="36" height="36" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="28" fill="#0b6b58"/><g transform="translate(64.0 64.0)" fill="#f4c63a"><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(0)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(60)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(120)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(180)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(240)"/><path d="M -2.73 0 L -6.72 -35.28 A 6.72 6.72 0 0 1 6.72 -35.28 L 2.73 0 Z" transform="rotate(300)"/><circle r="4.41"/></g></svg></a>
    <h1 id="title">Lifelog</h1>
    <button class="step" id="prev" aria-label="Previous day with recordings">‹</button>
    <button class="step" id="next" aria-label="Next day with recordings">›</button>
    <input type="date" id="pick" aria-label="Go to a date">
    <button id="ask" aria-pressed="false">Ask</button>
    <button id="remind" aria-pressed="false">Reminders</button>
    <button id="settings" aria-pressed="false">Settings</button>
    <input type="file" id="file" accept=".zip,application/zip" hidden>
    <input type="search" id="search" placeholder="Search what was said" aria-label="Search what was said">
  </div>
  <p id="status" role="status" hidden></p>
  <div id="strip" role="img" aria-label="When speech was recorded during this day"></div>
  <div id="hours" aria-hidden="true"></div>
</header>
<main id="main" aria-live="polite"></main>
<div id="player" hidden>
  <div id="now"></div>
  <div id="transport">
    <button id="toggle">Pause</button>
    <button class="skip" id="back" aria-label="Back 10 seconds">−10 s</button>
    <button class="skip" id="ahead" aria-label="Forward 10 seconds">+10 s</button>
    <span id="at">0:00</span>
    <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Position in this conversation">
    <span id="total">0:00</span>
  </div>
</div>
<audio id="audio" preload="auto"></audio>

<script>
const $ = (id) => document.getElementById(id);
const main = $("main"), strip = $("strip"), audio = $("audio");
const DAY_MS = 86400000, QUIET_MS = 120000;
const clock = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit" });
const clockSec = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
const longDay = new Intl.DateTimeFormat([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const thisYearDay = new Intl.DateTimeFormat([], { weekday: "long", day: "numeric", month: "long" });

let days = [];        // [{day, lines}] for days that have speech
let day = null;       // "YYYY-MM-DD" being shown
let lines = [];       // utterances of that day
let playing = null;   // utterance being played
let wanted = null;    // { line, talk }: what to reveal after loading a day
let searching = false;
let talks = [];       // summarised conversations of the day
let reminding = false;
let configuring = false;
let asking = false;
let chat = [];        // the Ask thread: [{ role, content, lines }]
let chatId = null;    // its saved id, once the first question has been answered
let threads = [];     // saved threads: [{ id, title, updated, questions }]
let chatBusy = false;
let groups = [];              // the day's conversation cards
const openCards = new Set();  // cards the reader has opened, kept across refreshes
const TALK_GAP_MS = 300000;   // a silence this long separates unsummarised conversations

const pad = (n) => String(n).padStart(2, "0");
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayStart = (key) => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

async function get(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function quietFor(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return `quiet for ${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return `quiet for ${h} h${m ? ` ${m} min` : ""}`;
}

function lineButton(u, showDay, sameMinute) {
  const t = new Date(u.start);
  // Within a run of speech, only show the time when the minute changes.
  const b = el("button", { className: "line", id: `u${u.id}`, title: clockSec.format(t) },
    el("time", { dateTime: t.toISOString(), textContent: sameMinute ? "" : clock.format(t) }),
    el("span", { textContent: u.text }));
  if (!u.audio && !showDay) b.classList.add("mute");
  b.addEventListener("click", () => showDay ? openDay(showDay, u.id) : play(u));
  return b;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

/* A reminder with the actions that fit its state. `after` runs once it is saved. */
function todoRow(r, after, source) {
  const row = el("div", { className: `todo ${r.status}` }, el("p", { textContent: r.text }));
  const act = (label, status) => {
    const b = el("button", { textContent: label });
    b.addEventListener("click", async () => {
      try { await post(`/api/reminders/${r.id}`, { status }); r.status = status; after(); }
      catch (err) { row.append(el("small", { textContent: `Could not save. ${err.message}` })); }
    });
    return b;
  };
  if (r.status === "suggested") row.append(act("Accept", "accepted"), act("Dismiss", "dismissed"));
  else if (r.status === "accepted") row.append(act("Done", "done"), act("Dismiss", "dismissed"));
  if (source) row.append(source);
  return row;
}

/* A link from a reminder back to the conversation, and the line, it came from. */
function whereLink(r) {
  const box = el("small", { className: "where" });
  const go = el("a", { href: `#${r.day}`, textContent: `${longDay.format(new Date(r.line ? r.line.start : r.start))}, in “${r.from}”` });
  // Going to where a reminder came from also plays it: hearing it is the point.
  go.addEventListener("click", (e) => { e.preventDefault(); openDay(r.day, r.line?.id, r.conversation, true); });
  box.append(go);
  if (r.line) {
    const said = r.line.text.length > 160 ? `${r.line.text.slice(0, 160)}…` : r.line.text;
    box.append(el("q", { textContent: said }));
  }
  return box;
}

async function countReminders() {
  try {
    const waiting = (await get("/api/reminders")).filter((r) => r.status === "suggested").length;
    $("remind").textContent = waiting ? `Reminders (${waiting})` : "Reminders";
  } catch { /* leave the label as it is */ }
}

async function showReminders() {
  reminding = true;
  configuring = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");
  history.replaceState(null, "", "#reminders");
  $("remind").setAttribute("aria-pressed", "true");
  $("settings").setAttribute("aria-pressed", "false");
  $("title").textContent = "Reminders";
  strip.replaceChildren();
  let all;
  try { all = await get("/api/reminders"); }
  catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load reminders. ${err.message}` }));
    return;
  }
  const group = (heading, status) => {
    const rows = all.filter((r) => r.status === status);
    return rows.length ? [el("h2", { textContent: heading }), ...rows.map((r) => todoRow(r, showReminders, whereLink(r)))] : [];
  };
  const nodes = [...group("To review", "suggested"), ...group("Accepted", "accepted")];
  main.replaceChildren(...(nodes.length ? nodes : [el("div", { className: "empty" },
    el("p", { textContent: "No reminders to review." }),
    el("p", {}, "They are suggested when conversations are summarised. Run ", el("code", { textContent: "limitful digest" }), "."))]));
  countReminders();
}

function whoRow(speaker) {
  if (!speaker) return el("div", { className: "who unknown", textContent: "Not identified" });
  const linked = speaker.id !== null;  // false: an imported label not yet tied to a person
  const row = el("div", { className: "who" });
  const name = el("button", { textContent: speaker.name, title: "Name this speaker" });
  name.addEventListener("click", () => {
    const input = el("input", { value: linked ? speaker.name : "", placeholder: "Who is this?", maxLength: 80, ariaLabel: "Speaker name" });
    const here = el("button", { className: "here", textContent: "Only this conversation" });
    const hint = el("small", { textContent: linked
      ? "Enter renames this person everywhere."
      : "Enter names this speaker in this conversation." });
    row.replaceChildren(input, ...(linked ? [here] : []), hint);
    input.focus(); input.select();
    let busy = false;
    const cancel = () => { if (!busy) row.replaceChildren(name); };
    const save = async (everywhere) => {
      const value = input.value.trim();
      if (!value || (everywhere && value === speaker.name)) { cancel(); return; }
      busy = true;
      try {
        await post(everywhere ? `/api/speakers/${speaker.id}` : `/api/lines/${speaker.line}/speaker`, { name: value });
        lines = await get(`/api/day/${day}`);
        renderDay();
      } catch (err) {
        busy = false;
        hint.textContent = `Could not save. ${err.message}`;
      }
    };
    // Leaving the field cancels, unless the click went to the button beside it.
    input.addEventListener("blur", (e) => { if (e.relatedTarget !== here) cancel(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Escape") cancel();
      else if (e.key === "Enter") save(linked);
    });
    here.addEventListener("click", () => save(false));
  });
  row.append(name);
  return row;
}

function renderDay() {
  // The year is in the date field beside it; only spell it out for other years.
  const shown = new Date(dayStart(day));
  $("title").textContent = (shown.getFullYear() === new Date().getFullYear() ? thisYearDay : longDay).format(shown);
  document.title = `Lifelog, ${day}`;
  $("pick").value = day;
  const known = days.map((d) => d.day);
  $("prev").disabled = !known.some((d) => d < day);
  $("next").disabled = !known.some((d) => d > day);

  const start = dayStart(day);
  strip.replaceChildren(...lines.map((u) => {
    const i = el("i", { id: `s${u.id}` });
    i.style.left = `${((u.start - start) / DAY_MS) * 100}%`;
    i.style.width = `${(Math.max(u.end - u.start, 1000) / DAY_MS) * 100}%`;
    return i;
  }));
  $("hours").replaceChildren(...[0, 6, 12, 18].map((h) => {
    const s = el("span", { textContent: new Intl.DateTimeFormat([], { hour: "numeric" }).format(new Date(start + h * 3600000)) });
    s.style.left = `${(h / 24) * 100}%`;
    return s;
  }));

  if (!lines.length) {
    main.replaceChildren(el("div", { className: "empty" },
      el("p", { textContent: "Nothing was said on this day, or nothing has been synced yet." }),
      el("p", {}, "To bring in new audio from the pendant, run ", el("code", { textContent: "limitful watch" }), ".")));
    return;
  }
  groups = buildGroups();
  const toggleAll = el("button", { id: "all", textContent: "Open all" });
  toggleAll.addEventListener("click", () => {
    const open = toggleAll.textContent === "Open all";
    groups.forEach((g) => g.setOpen(open));
    toggleAll.textContent = open ? "Close all" : "Open all";
  });
  const count = `${groups.length} conversation${groups.length === 1 ? "" : "s"}`;
  main.replaceChildren(
    el("div", { className: "tools" }, el("span", { textContent: count }), toggleAll),
    ...groups.map(card));
  if (groups.length === 1) groups[0].setOpen(true);
  markPlaying();
  if (wanted) {
    const { line, talk, start } = wanted;
    wanted = null;
    document.querySelectorAll(".found").forEach((n) => n.classList.remove("found"));
    let from = null;  // the line to start playing at, when asked to
    if (line && groups.some((g) => g.own.some((u) => u.id === line))) {
      reveal(line, true);
      from = lines.find((u) => u.id === line);
    } else if (talk) {
      const g = groups.find((x) => x.key === `c${talk}`);
      if (g) {
        g.setOpen(true);
        $(`g${g.key}`).scrollIntoView({ block: "start" });
        from = g.own.find((u) => u.audio);
      }
    }
    if (start && from) play(from);
  }
}

/* The day's conversations: summarised ones, plus runs of lines that have no summary. */
function buildGroups() {
  const out = [], taken = new Set();
  for (const t of talks) {
    const own = lines.filter((u) => u.start >= t.start && u.start <= t.end);
    if (!own.length) continue;
    own.forEach((u) => taken.add(u.id));
    out.push({ ...t, key: `c${t.id}`, own });
  }
  let run = null;
  for (const u of lines) {
    if (taken.has(u.id)) { run = null; continue; }
    if (!run || u.start - run.end > TALK_GAP_MS) {
      run = { key: `l${u.start}`, start: u.start, end: u.end, title: null, summary: [], sections: [], reminders: [], own: [] };
      out.push(run);
    }
    run.own.push(u);
    run.end = Math.max(run.end, u.end);
  }
  return out.sort((x, y) => x.start - y.start);
}

function lengthOf(ms) {
  const min = Math.round(ms / 60000);
  if (min < 1) return "under a minute";
  if (min < 60) return `${min} min`;
  return `${Math.floor(min / 60)} h${min % 60 ? ` ${min % 60} min` : ""}`;
}

function card(g) {
  const first = g.own[0].text;
  const title = g.title || (first.length > 70 ? `${first.slice(0, 70)}…` : first);
  const waiting = g.reminders.filter((r) => r.status === "suggested").length;
  const meta = [lengthOf(g.end - g.start), `${g.own.length} line${g.own.length === 1 ? "" : "s"}`];
  if (waiting) meta.push(`${waiting} reminder${waiting === 1 ? "" : "s"} to review`);
  const body = el("div", { className: "body" });
  const box = el("details", { className: "card", id: `g${g.key}` },
    el("summary", {},
      el("time", { textContent: clock.format(new Date(g.start)) }),
      el("div", {},
        el("h2", { textContent: title, className: g.title ? "" : "untitled" }),
        el("p", { className: "meta", textContent: meta.join(", ") }))),
    body);
  // The transcript is only built when the card is first opened: days can hold thousands of lines.
  const fill = () => { if (!body.childElementCount) { body.append(...cardBody(g)); markPlaying(); } };
  box.addEventListener("toggle", () => {
    if (box.open) { openCards.add(g.key); fill(); } else openCards.delete(g.key);
  });
  g.setOpen = (open) => { if (open) { openCards.add(g.key); fill(); } else openCards.delete(g.key); box.open = open; };
  if (openCards.has(g.key)) g.setOpen(true);
  return box;
}

function cardBody(g) {
  const nodes = [];
  if (!g.sections.length && g.summary.length) nodes.push(el("ul", {}, ...g.summary.map((t) => el("li", { textContent: t }))));
  const open = g.reminders.filter((r) => r.status === "suggested" || r.status === "accepted");
  nodes.push(...open.map((r) => {
    let jump = null;
    if (r.line && g.own.some((u) => u.id === r.line)) {
      jump = el("button", { className: "jump", textContent: "Play the line" });
      jump.addEventListener("click", () => {
        reveal(r.line, true);
        const from = lines.find((u) => u.id === r.line);
        if (from) play(from);
      });
    }
    return todoRow(r, () => { renderDay(); countReminders(); }, jump);
  }));

  const copy = el("button", { className: "copy", textContent: "Copy as Markdown" });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(asMarkdown(g)); copy.textContent = "Copied"; }
    catch { copy.textContent = "Could not copy"; }
    setTimeout(() => { copy.textContent = "Copy as Markdown"; }, 2000);
  });
  nodes.push(copy);

  const labelled = g.own.some((u) => u.speaker);
  const who = (x) => x.speaker ? (x.speaker.id ?? x.speaker.name) : 0;
  const headings = [...g.sections];
  g.own.forEach((u, n) => {
    const before = g.own[n - 1];
    let fresh = !before;
    while (headings.length && headings[0].start <= u.start) {
      const heading = headings.shift();
      nodes.push(el(heading.level === 2 ? "h3" : "h4", { textContent: heading.title }));
      fresh = true;
    }
    const gap = before && u.start - before.end > QUIET_MS;
    if (gap) nodes.push(el("div", { className: "quiet", textContent: quietFor(u.start - before.end) }));
    // Say who is speaking whenever it changes, and at the top of each section.
    if (labelled && (fresh || gap || who(before) !== who(u))) nodes.push(whoRow(u.speaker));
    const sameMinute = !fresh && !gap && Math.floor(before.start / 60000) === Math.floor(u.start / 60000);
    nodes.push(lineButton(u, null, sameMinute));
  });
  return nodes;
}

function asMarkdown(g) {
  const out = [`# ${g.title || "Conversation"}`, ""];
  const headings = [...g.sections];
  for (const u of g.own) {
    while (headings.length && headings[0].start <= u.start) {
      const heading = headings.shift();
      out.push("", `${"#".repeat(heading.level)} ${heading.title}`, "");
    }
    out.push(`- **${clockSec.format(new Date(u.start))}** ${u.speaker ? `${u.speaker.name}: ` : ""}${u.text}`);
  }
  return out.join("\n") + "\n";
}

/* Open the card holding a line and bring the line into view. */
function reveal(id, mark) {
  const g = groups.find((x) => x.own.some((u) => u.id === id));
  if (!g) return;
  g.setOpen(true);
  const node = $(`u${id}`);
  if (!node) return;
  node.scrollIntoView({ block: "center" });
  if (mark) node.classList.add("found"); else node.focus({ preventScroll: true });
}

async function openDay(key, revealId, revealTalk, startPlaying) {
  searching = false;
  reminding = false;
  configuring = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");
  $("remind").setAttribute("aria-pressed", "false");
  $("settings").setAttribute("aria-pressed", "false");
  $("search").value = "";
  day = key;
  wanted = revealId || revealTalk
    ? { line: revealId || null, talk: revealTalk || null, start: Boolean(startPlaying) } : null;
  history.replaceState(null, "", `#${key}`);
  try {
    [lines, talks] = await Promise.all([get(`/api/day/${key}`), get(`/api/conversations/${key}`)]);
    renderDay();
  } catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load this day. ${err.message}` }));
  }
}

function step(direction) {
  const known = days.map((d) => d.day);
  const target = direction < 0
    ? known.filter((d) => d < day).pop()
    : known.find((d) => d > day);
  if (target) openDay(target);
}

async function runSearch(query) {
  searching = true;
  reminding = false;
  configuring = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");
  $("remind").setAttribute("aria-pressed", "false");
  $("settings").setAttribute("aria-pressed", "false");
  $("title").textContent = "Search";
  strip.replaceChildren();
  let results;
  try {
    results = await get(`/api/search?q=${encodeURIComponent(query)}`);
  } catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Search failed. ${err.message}` }));
    return;
  }
  if ($("search").value.trim() !== query) return;  // a newer search is on its way
  if (!results.length) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Nothing found for “${query}”.` }));
    return;
  }
  const nodes = [];
  let last = null;
  for (const u of results) {
    if (u.day !== last) {
      last = u.day;
      const a = el("a", { href: `#${u.day}`, textContent: longDay.format(new Date(dayStart(u.day))) });
      a.addEventListener("click", (e) => { e.preventDefault(); openDay(u.day); });
      nodes.push(el("h2", {}, a));
    }
    nodes.push(lineButton(u, u.day));
  }
  main.replaceChildren(...nodes);
}

/* Playback. One audio element plays a "track": the recordings behind one conversation,
   end to end, so the timeline covers the whole conversation and not one short file. */
let track = null;  // { key, last, pieces: [{ audio, from, to, base }], total, at }
const seek = $("seek");
let scrubbing = false;

function buildTrack(u) {
  const g = groups.find((x) => x.own.some((v) => v.id === u.id));
  const own = (g ? g.own : [u]).filter((v) => v.audio);
  const pieces = [];
  for (const v of own) {
    const from = v.offset / 1000, to = (v.offset + (v.end - v.start)) / 1000 + 1;
    const last = pieces[pieces.length - 1];
    if (last && last.audio === v.audio) last.to = Math.max(last.to, to);
    else pieces.push({ audio: v.audio, from, to });
  }
  let base = 0;
  for (const p of pieces) { p.base = base; base += p.to - p.from; }
  return { key: g ? g.key : `u${u.id}`, last: own[own.length - 1], pieces, total: base, at: 0 };
}

/* Move the audio element to a time in a recording, loading the file if needed. */
function cue(path, time, start) {
  const go = () => { audio.currentTime = time; if (start) audio.play(); };
  if (audio.dataset.src !== path) {
    audio.dataset.src = path;
    audio.src = path;
    audio.addEventListener("loadedmetadata", go, { once: true });
  } else go();
}

function play(u) {
  if (!u.audio) return;  // imported line with no recording
  playing = u;
  const g = groups.find((x) => x.own.some((v) => v.id === u.id));
  if (!track || track.key !== (g ? g.key : `u${u.id}`)) track = buildTrack(u);
  track.at = Math.max(0, track.pieces.findIndex((p) => p.audio === u.audio));
  cue(u.audio, u.offset / 1000, true);
  markPlaying();
  showPosition();
}

/* Where we are in the conversation, in seconds from its start. */
function position() {
  const p = track.pieces[track.at];
  return p.base + Math.min(Math.max(0, audio.currentTime - p.from), p.to - p.from);
}

function jumpTo(seconds) {
  if (!track) return;
  const want = Math.min(Math.max(0, seconds), Math.max(0, track.total - 0.3));
  let i = track.pieces.findIndex((p) => want < p.base + (p.to - p.from));
  if (i < 0) i = track.pieces.length - 1;
  const p = track.pieces[i];
  track.at = i;
  cue(p.audio, p.from + (want - p.base), !audio.paused);
}

/* The end of a recording, or of this conversation's part of it: carry on with what follows. */
function advance() {
  if (track.at + 1 < track.pieces.length) {
    track.at += 1;
    const p = track.pieces[track.at];
    cue(p.audio, p.from, true);
    return;
  }
  const next = lines.find((u) => u.audio && u.start > track.last.start);
  if (next) play(next); else { playing = null; track = null; markPlaying(); }
}

function markPlaying() {
  document.querySelectorAll(".on").forEach((n) => n.classList.remove("on"));
  $("player").hidden = !playing;
  if (!playing) return;
  $(`u${playing.id}`)?.classList.add("on");
  $(`s${playing.id}`)?.classList.add("on");
  const t = new Date(playing.start);
  $("now").replaceChildren(el("time", { textContent: clockSec.format(t) }), playing.text);
}

const stamp = (seconds) => {
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
};

function showPosition() {
  if (!track) return;
  seek.max = track.total;
  $("total").textContent = stamp(track.total);
  if (scrubbing) return;  // the reader's hand wins over the playhead
  const at = position();
  seek.value = at;
  $("at").textContent = stamp(at);
  seek.setAttribute("aria-valuetext", `${stamp(at)} of ${stamp(track.total)}`);
}

audio.addEventListener("timeupdate", () => {
  if (!playing || !track) return;
  const piece = track.pieces[track.at];
  if (!audio.seeking && audio.dataset.src === piece.audio && audio.currentTime > piece.to + 0.25) {
    advance();
    return;
  }
  const at = audio.currentTime * 1000;
  const same = lines.filter((u) => u.audio === audio.dataset.src && u.offset <= at + 150);
  const current = same[same.length - 1];
  if (current && current.id !== playing.id) { playing = current; markPlaying(); }
  showPosition();
});
audio.addEventListener("seeked", showPosition);
audio.addEventListener("ended", () => { if (track) advance(); });
audio.addEventListener("play", () => { $("toggle").textContent = "Pause"; });
audio.addEventListener("pause", () => { $("toggle").textContent = "Play"; });
audio.addEventListener("error", () => {
  if (!playing) return;
  $("now").textContent = "This recording could not be played. Chrome and Firefox play these files; older Safari does not.";
});
$("toggle").addEventListener("click", () => audio.paused ? audio.play() : audio.pause());
seek.addEventListener("input", () => { scrubbing = true; $("at").textContent = stamp(seek.value); });
seek.addEventListener("change", () => { scrubbing = false; jumpTo(Number(seek.value)); });
$("back").addEventListener("click", () => jumpTo(position() - 10));
$("ahead").addEventListener("click", () => jumpTo(position() + 10));

strip.addEventListener("click", (e) => {
  if (!lines.length) return;
  const box = strip.getBoundingClientRect();
  const at = dayStart(day) + ((e.clientX - box.left) / box.width) * DAY_MS;
  const nearest = lines.reduce((a, b) => Math.abs(b.start - at) < Math.abs(a.start - at) ? b : a);
  reveal(nearest.id, false);
});

/* Importing a Limitless export, and the slower speaker recognition that follows it. */
function say(text, failed) {
  const box = $("status");
  box.hidden = !text;
  box.textContent = text || "";
  box.classList.toggle("failed", Boolean(failed));
}

let watching = null;
async function watchJob() {
  let job;
  try { job = await get("/api/status"); } catch { return; }
  document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = job.running; });
  if (job.running) {
    say(job.total ? `${job.what}: ${job.done} of ${job.total}. You can keep using the page.` : `${job.what}…`);
    if (!watching) watching = setInterval(watchJob, 3000);
    return;
  }
  if (watching) {
    clearInterval(watching);
    watching = null;
    say(job.error || job.note || "Finished.", Boolean(job.error));
    if (configuring) showSettings();
    days = await get("/api/days");
    if (!searching && !reminding && !configuring && !asking) openDay(day);
  } else if (job.error) {
    say(job.error, true);
  }
}

$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = true; });
  say(`Importing ${file.name}. Large exports take a minute; keep this page open.`);
  try {
    const res = await fetch("/api/import", { method: "POST", headers: { "Content-Type": "application/zip" }, body: file });
    if (!res.ok) throw new Error(await res.text());
    const r = await res.json();
    const added = r.conversations
      ? `Imported ${r.conversations} conversations, ${r.lines} lines and ${r.hours} hours of audio.`
      : "Nothing new in that export.";
    say(r.skipped ? `${added} ${r.skipped} conversations were already here.` : added);
    days = await get("/api/days");
    countReminders();
    if (r.conversations && days.length) openDay(days[days.length - 1].day);
    watchJob();
  } catch (err) {
    say(`Import failed. ${err.message}`, true);
    document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = false; });
  }
});

/* Settings: what writes summaries, the Anthropic key, and importing an export. */
async function showSettings() {
  configuring = true;
  reminding = false;
  searching = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");
  history.replaceState(null, "", "#settings");
  $("settings").setAttribute("aria-pressed", "true");
  $("remind").setAttribute("aria-pressed", "false");
  $("title").textContent = "Settings";
  strip.replaceChildren();
  let now;
  try { now = await get("/api/settings"); }
  catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load settings. ${err.message}` }));
    return;
  }
  const choice = (value, name, about) => {
    const radio = el("input", { type: "radio", name: "provider", value, checked: (now.provider || "") === value });
    return el("label", { className: "choice" }, radio, el("b", { textContent: name }), el("span", { textContent: about }));
  };
  const key = el("input", { type: "password", id: "key", autocomplete: "off", spellcheck: false,
    placeholder: now.has_key ? `A key is saved (${now.key_hint}). Type a new one to replace it.` : "sk-ant-…" });
  const keyHelp = el("small", { textContent: now.has_key
    ? "Kept on this computer in ~/.config/limitful/config.json and sent only to Anthropic."
    : "Optional. Leave it empty to use your sign-in from the Anthropic command-line tool (ant auth login). A key is kept on this computer in ~/.config/limitful/config.json and sent only to Anthropic." });
  const forget = el("button", { className: "pill", textContent: "Remove saved key", hidden: !now.has_key });
  const keyBox = el("div", { className: "key" }, el("label", { htmlFor: "key", textContent: "Anthropic API key" }), key, keyHelp);
  const note = el("p", { className: "note", role: "status" });
  const tell = (text, failed) => { note.textContent = text; note.classList.toggle("failed", Boolean(failed)); };
  const save = el("button", { className: "pill main", textContent: "Save" });
  // Only switched on and off by running jobs when there is something to run it with.
  const run = el("button", { className: now.provider ? "pill busy-off" : "pill", textContent: "Summarise new conversations now", disabled: !now.provider });
  const picked = () => document.querySelector('input[name="provider"]:checked')?.value ?? "";
  const options = el("fieldset", {},
    el("legend", { hidden: true, textContent: "What writes summaries" }),
    choice("", "Off", "Conversations recorded from the pendant keep their opening words as a title."),
    choice("claude", "Claude", `Best results, using ${now.claude_model}. The transcript of each conversation is sent to Anthropic, and usage is billed to your Anthropic account.`),
    keyBox,
    choice("ollama", "Ollama", `Runs on this computer with the ${now.ollama_model} model, so nothing leaves it. Weaker, and Ollama must be running.`));
  const showKey = () => { keyBox.hidden = picked() !== "claude"; };
  options.addEventListener("change", showKey);

  const send = async (body, done) => {
    save.disabled = true;
    tell(body.provider === "claude" ? "Checking with Anthropic…" : "Saving…");
    try { await post("/api/settings", body); await showSettings(); done(); }
    catch (err) { tell(`Could not save. ${err.message}`, true); save.disabled = false; }
  };
  save.addEventListener("click", () => {
    const body = { provider: picked() };
    if (key.value.trim()) body.api_key = key.value.trim();
    send(body, () => say("Settings saved."));
  });
  forget.addEventListener("click", () => send({ provider: picked() === "claude" ? "" : picked(), api_key: "" }, () => say("Key removed.")));
  run.addEventListener("click", async () => {
    try { await post("/api/digest", {}); watchJob(); }
    catch (err) { tell(err.message, true); }
  });

  // --- the pendant: what it reports, its light, and syncing on demand
  const about = el("p", { className: "note", role: "status" });
  const describe = (p) => {
    about.classList.toggle("failed", Boolean(p.error));
    if (!p.checked) { about.textContent = "Not checked yet. Checking takes a few seconds over Bluetooth."; return; }
    const ago = Math.max(0, Math.round((Date.now() - p.checked) / 60000));
    const when = ago < 1 ? "just now" : `${ago} min ago`;
    if (p.error) { about.textContent = `Could not reach it (${when}): ${p.error}.`; return; }
    const waiting = p.minutes_waiting < 1 ? "Nothing waiting to sync"
      : `${lengthOf(p.minutes_waiting * 60000)} of audio waiting to sync`;
    about.textContent = `Battery ${p.battery ?? "?"}%. ${waiting}. Room for about ${Math.round(p.hours_free)} more hours. Checked ${when}.`;
  };
  const check = el("button", { className: "pill busy-off", textContent: "Check pendant" });
  const sync = el("button", { className: "pill busy-off", textContent: "Sync now" });
  const light = el("input", { type: "range", min: 0, max: 100, step: 5, id: "light", ariaLabel: "Brightness of the pendant's light" });
  const lightValue = el("output", { htmlFor: "light" });
  const showLight = () => { lightValue.textContent = Number(light.value) === 0 ? "off" : `${light.value}%`; };
  check.addEventListener("click", async () => {
    check.disabled = true;
    about.classList.remove("failed");
    about.textContent = "Looking for the pendant…";
    try { describe(await post("/api/pendant", { action: "check" })); }
    catch (err) { about.textContent = err.message; about.classList.add("failed"); }
    check.disabled = false;
  });
  sync.addEventListener("click", async () => {
    try { await post("/api/pendant", { action: "sync" }); watchJob(); }
    catch (err) { about.textContent = err.message; about.classList.add("failed"); }
  });
  light.addEventListener("input", showLight);
  light.addEventListener("change", async () => {
    light.disabled = true;
    about.classList.remove("failed");
    about.textContent = "Setting the light…";
    try { await post("/api/pendant", { action: "brightness", value: Number(light.value) }); about.textContent = `Light set to ${lightValue.textContent}.`; }
    catch (err) { about.textContent = err.message; about.classList.add("failed"); }
    light.disabled = false;
  });
  let pendantNow = { checked: null };
  try { pendantNow = await get("/api/pendant"); } catch { /* shown as not checked */ }
  light.value = pendantNow.brightness ?? 100;
  showLight();
  describe(pendantNow);

  const pick = el("button", { className: "pill busy-off", textContent: "Choose an export zip" });
  pick.addEventListener("click", () => $("file").click());
  main.replaceChildren(el("div", { className: "setup" },
    el("h2", { textContent: "Pendant" }),
    el("p", { textContent: "Sync pulls new audio off the pendant, frees it there, then transcribes and summarises it. The pendant must be near this computer and not connected to a phone." }),
    el("div", { className: "row" }, check, sync),
    about,
    el("div", { className: "row light" }, el("label", { htmlFor: "light", textContent: "Light" }), light, lightValue),
    el("p", { className: "small", textContent: pendantNow.brightness == null
      ? "The pendant does not report its brightness, so this shows 100% until you set it here."
      : "The pendant does not report its brightness; this is the last value set from here." }),
    el("p", { className: "small", textContent: "To stop recording, hold the pendant's button for two seconds to switch it off. No command for pausing from here is known." }),
    el("h2", { textContent: "Summaries" }),
    el("p", { textContent: "A title, a short summary and suggested reminders for each conversation recorded from the pendant. Conversations imported from Limitless already have theirs." }),
    options,
    el("div", { className: "row" }, save, run, forget),
    note,
    el("h2", { textContent: "Import from Limitless" }),
    el("p", { textContent: "Bring in a data export: conversations, transcripts, audio and reminders. Importing the same export twice adds nothing." }),
    el("div", { className: "row" }, pick),
    el("p", { className: "about" }, el("b", { textContent: "*" }), " Limitful", el("br"), el("small", { textContent: "limits apply" }))));
  showKey();
  watchJob();
}
$("settings").addEventListener("click", () => configuring ? openDay(day) : showSettings());

/* Ask: questions about what was said, answered from the transcripts with links to the lines. */
const shortWhen = new Intl.DateTimeFormat([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

/* An answer is plain text with "- " lists, **bold** and [L123] citations. Build it as nodes. */
function replyNodes(text, cited) {
  const inline = (line) => {
    const out = [];
    for (const part of line.split(/(\*\*[^*]+\*\*|\[L\d+\])/)) {
      const ref = part.match(/^\[L(\d+)\]$/);
      if (ref) {
        const where = cited[ref[1]];
        if (!where) continue;  // an id the model was never shown
        const a = el("a", { className: "cite", href: `#${where.day}/${ref[1]}`, title: `“${where.text}”`,
          textContent: shortWhen.format(new Date(where.start)) });
        a.addEventListener("click", (e) => { e.preventDefault(); openDay(where.day, Number(ref[1]), where.conversation, true); });
        out.push(a);
      } else if (/^\*\*[^*]+\*\*$/.test(part)) out.push(el("b", { textContent: part.slice(2, -2) }));
      else if (part) out.push(part);
    }
    return out;
  };
  const nodes = [];
  for (const block of text.split(/\n\s*\n/)) {
    let list = null, para = [];
    const flush = () => { if (para.length) { nodes.push(el("p", {}, ...inline(para.join(" ")))); para = []; } };
    for (const line of block.split("\n")) {
      const item = line.match(/^\s*[-*•]\s+(.*)$/);
      if (item) {
        flush();
        if (!list) { list = el("ul"); nodes.push(list); }
        list.append(el("li", {}, ...inline(item[1])));
      } else { list = null; para.push(line.trim()); }
    }
    flush();
  }
  return nodes;
}

function showAsk() {
  asking = true;
  searching = false; reminding = false; configuring = false;
  history.replaceState(null, "", "#ask");
  for (const [id, on] of [["ask", true], ["remind", false], ["settings", false]]) $(id).setAttribute("aria-pressed", String(on));
  $("title").textContent = "Ask";
  strip.replaceChildren();

  const box = el("div", { className: "chat" });
  const working = el("p", { className: "working", role: "status" });
  const field = el("textarea", { rows: 1, placeholder: "Ask about anything you've said or heard", ariaLabel: "Your question" });
  const go = el("button", { className: "pill main", textContent: "Ask", type: "submit" });
  const form = el("form", {}, field, go);
  const fresh = el("button", { className: "pill", textContent: "New chat", type: "button", hidden: !chat.length });

  const paint = () => {
    const thread = [];
    for (const turn of chat) {
      if (turn.role === "user") thread.push(el("p", { className: "asked", textContent: turn.content }));
      else thread.push(el("div", { className: "reply" }, ...replyNodes(turn.content, turn.lines || {})));
    }
    const lead = chat.length ? [] : [
      el("p", { className: "lead", textContent: "Ask what was said, what you agreed to, or when something came up. Answers link to the lines they come from, so you can hear the moment." }),
      el("div", { className: "tries" }, ...[
        "What did I agree to do this week?",
        "Who did I talk to most recently, and about what?",
        "What were the main things discussed on my busiest day?",
      ].map((q) => { const b = el("button", { className: "pill", textContent: q, type: "button" }); b.addEventListener("click", () => send(q)); return b; })),
    ];
    fresh.hidden = !chat.length;
    const others = threads.filter((t) => t.id !== chatId);
    const past = el("details", { className: "past", open: !chat.length, hidden: !others.length },
      el("summary", { textContent: `Earlier chats (${others.length})` }),
      ...others.map((t) => {
        const open = el("button", { className: "open", type: "button", textContent: t.title });
        open.addEventListener("click", () => loadThread(t.id));
        const remove = el("button", { className: "remove", type: "button", textContent: "Delete", ariaLabel: `Delete the chat “${t.title}”` });
        remove.addEventListener("click", async () => {
          if (remove.textContent === "Delete") { remove.textContent = "Really delete?"; return; }
          try { await post(`/api/chats/${t.id}/delete`, {}); threads = await get("/api/chats"); paint(); }
          catch (err) { remove.textContent = "Could not delete"; }
        });
        const when = `${shortWhen.format(new Date(t.updated))}, ${t.questions} question${t.questions === 1 ? "" : "s"}`;
        return el("div", { className: "row" }, open, el("small", { textContent: when }), remove);
      }));
    box.replaceChildren(...lead, ...thread, working, form,
      el("p", { className: "fine" }, "Your questions and the transcript lines Claude reads are sent to Anthropic. Chats are saved on this computer. ", fresh),
      past);
  };

  const loadThread = async (id) => {
    if (chatBusy) return;
    try { chat = await get(`/api/chats/${id}`); chatId = id; paint(); field.focus(); }
    catch (err) { working.textContent = `Could not open that chat. ${err.message}`; working.classList.add("failed"); }
  };

  const send = async (question) => {
    question = question.trim();
    if (!question || chatBusy) return;
    chatBusy = true;
    chat.push({ role: "user", content: question });
    field.value = "";
    paint();
    go.disabled = true;
    working.classList.remove("failed");
    working.textContent = "Thinking…";
    working.scrollIntoView({ block: "nearest" });
    let failure = null;
    // The answer appears as it is written. Citations become links once it is complete.
    let draft = "";
    const live = el("div", { className: "reply" });
    const drawDraft = () => {
      const shown = draft.replace(/\[L\d+\]/g, "").replace(/\[L?\d*$/, "").replace(/\*\*?$/, "");
      live.replaceChildren(...replyNodes(shown, {}));
      if (!live.isConnected && shown.trim()) working.before(live);
      if (asking) working.scrollIntoView({ block: "nearest" });
    };
    try {
      const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, chat: chatId }) });
      if (!res.ok) throw new Error(await res.text());
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buffer = "", done = false;
      const take = (line) => {
        if (!line.trim()) return;
        const item = JSON.parse(line);
        if (item.step) working.textContent = `${item.step}…`;
        else if (item.text === null) { draft = ""; live.remove(); }
        else if (typeof item.text === "string") {
          if (!draft) working.textContent = "";
          draft += item.text;
          drawDraft();
        }
        else if (item.error) failure = item.error;
        else if (item.answer) {
          chat.push({ role: "assistant", content: item.answer, lines: item.lines });
          chatId = item.chat;
          done = true;
        }
      };
      for (;;) {
        const { value, done: ended } = await reader.read();
        if (value) {
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n");
          buffer = parts.pop();
          parts.forEach(take);
        }
        if (ended) { take(buffer); break; }
      }
      if (!done && !failure) failure = "The answer was cut off. Try again.";
    } catch (err) { failure = err.message; }
    chatBusy = false;
    live.remove();
    if (!failure) { try { threads = await get("/api/chats"); } catch { /* the list catches up next time */ } }
    if (failure) {
      chat.pop();  // the question was not answered; put it back in the box to retry
      if (asking) { paint(); field.value = question; }
    } else if (asking) paint();
    go.disabled = false;
    working.textContent = failure ? `No answer. ${failure}` : "";
    working.classList.toggle("failed", Boolean(failure));
    if (asking) { (failure ? working : form).scrollIntoView({ block: "nearest" }); field.focus(); }
  };

  form.addEventListener("submit", (e) => { e.preventDefault(); send(field.value); });
  field.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(field.value); }
  });
  fresh.addEventListener("click", () => { if (!chatBusy) { chat = []; chatId = null; paint(); field.focus(); } });
  paint();
  main.replaceChildren(box);
  get("/api/chats").then((list) => { threads = list; if (asking && !chatBusy) paint(); }).catch(() => {});
  if (chatBusy) { go.disabled = true; working.textContent = "Still working on the last question…"; }
  field.focus();
}
$("ask").addEventListener("click", () => asking ? openDay(day) : showAsk());

$("remind").addEventListener("click", () => reminding ? openDay(day) : showReminders());
$("home").addEventListener("click", (e) => {
  e.preventDefault();
  openDay(days.length ? days[days.length - 1].day : dayKey(new Date()));
});
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("pick").addEventListener("change", (e) => e.target.value && openDay(e.target.value));

let timer;
$("search").addEventListener("input", (e) => {
  clearTimeout(timer);
  const query = e.target.value.trim();
  timer = setTimeout(() => query ? runSearch(query) : openDay(day), 200);
});

document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input, textarea");
  if (e.key === "Escape" && (searching || reminding || configuring || asking)) { openDay(day); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("search").focus(); }
  else if (e.shiftKey && track && e.key === "ArrowLeft") jumpTo(position() - 10);
  else if (e.shiftKey && track && e.key === "ArrowRight") jumpTo(position() + 10);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === " " && playing && !e.target.matches("button")) { e.preventDefault(); $("toggle").click(); }
});

/* New lines arrive while `limitful watch` runs; pick them up quietly. */
setInterval(async () => {
  if (searching || reminding || configuring || asking || document.hidden || !day) return;
  try {
    days = await get("/api/days");
    const [fresh, freshTalks] = await Promise.all([get(`/api/day/${day}`), get(`/api/conversations/${day}`)]);
    if (fresh.length !== lines.length || freshTalks.length !== talks.length) {
      lines = fresh; talks = freshTalks; renderDay(); countReminders();
    }
  } catch { /* the server is away; try again next time */ }
}, 30000);

(async () => {
  try {
    days = await get("/api/days");
  } catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load recordings. ${err.message}` }));
    return;
  }
  const [hashDay, hashId] = location.hash.slice(1).split("/");
  const start = /^\d{4}-\d{2}-\d{2}$/.test(hashDay) ? hashDay
    : days.length ? days[days.length - 1].day : dayKey(new Date());
  await openDay(start, hashId && Number(hashId));
  if (hashDay === "reminders") showReminders();
  if (hashDay === "settings") showSettings();
  if (hashDay === "ask") showAsk();
  watchJob();
  countReminders();
})();
</script>
