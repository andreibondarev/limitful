name: Website

# Publishes limitful.ai (GitHub Pages) from site/ and the assets it borrows.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/wordmark.svg"
      - "assets/wordmark-dark.svg"
      - "assets/logo.svg"
      - "assets/promo/limitful-promo.mp4"
      - "assets/promo/poster.jpg"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sh site/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
